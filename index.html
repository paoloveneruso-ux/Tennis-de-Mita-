        { const sum = sessionsSummary(course, e); const h = row.querySelector('.hint'); if(sum && h) h.insertAdjacentHTML('beforeend', '<br>Ore: '+esc(sum)); }
        row.querySelector('.pay-head').onclick = () => {
          if(state.payExpanded[r.key]) delete state.payExpanded[r.key]; else state.payExpanded[r.key] = true;
          paintEnrollList(state.enrollSearchText[cid]||'');
        };
        if(state.payExpanded[r.key]){
          const det = buildPayDetail(r, ()=>paintEnrollList(state.enrollSearchText[cid]||''));
          if(uniqueSessions(course).length > 1){
            let pending = enrolleeSessionSet(e);
            const picker = buildSessionPicker(course, pending, v=>{ pending = v; });
            const save = document.createElement('button');
            save.className = 'btn-ghost'; save.style.cssText = 'width:100%;margin-top:8px;padding:9px;font-size:12px;'; save.textContent = 'Salva ore';
            save.onclick = async () => {
              const val = picker.getValue();
              if(val==='none') return toast('Seleziona almeno un\'ora');
              const full = sessionsFull(cid, val, eid);
              if(full) return toast('Al completo: '+sessionLabel(full, multiCourt(course)));
              try{
                await update(ref(db, cpath('courseEnrollments/'+cid+'/'+eid)), { sessions: val });
                toast(val ? 'Ore salvate' : 'Frequenta tutte le ore');
              }catch(err){ toast('Errore: '+err.message); }
            };
            det.appendChild(picker); det.appendChild(save);
          }
          const del = document.createElement('button');
          del.className = 'small-btn'; del.style.marginTop = '10px'; del.textContent = 'Rimuovi corsista';
          del.onclick = async () => {
            if(!confirm('Rimuovere '+(e.name||'il corsista')+' dal corso?')) return;
            try{
              await remove(ref(db, cpath('courseEnrollments/'+cid+'/'+eid)));
              if(e.uid) await remove(ref(db, cpath('myEnrollments/'+e.uid+'/'+cid)));
              const newCount = Math.max(0,(state.courses[cid].enrolledCount||1)-1);
              await update(ref(db, cpath('courses/'+cid)), { enrolledCount: newCount });
            }catch(err){ toast('Errore: '+err.message); }
          };
          det.appendChild(del);
          row.appendChild(det);
        }
        enrollListHost.appendChild(row);
      });
    }
    paintEnrollList(state.enrollSearchText[cid]||'');
    box.querySelector('#enrollSearch-'+cid).oninput = (e)=>{ state.enrollSearchText[cid] = e.target.value; paintEnrollList(e.target.value); };

    box.querySelector('#addEnrollBtn-'+cid).onclick = async () => {
      const pk = state.pickers['enroll-'+cid] || {};
      const linked = pk.value ? allLinkedMembers.find(([_,m])=>m.uid===pk.value) : null;
      const linkedUid = linked ? linked[1].uid : null;
      const name = linked ? linked[1].name : (draft.name||'').trim();
      const phone = (draft.phone||'').trim();
      if(!name) return toast('Inserisci il nome o collega un socio');
      const courseNow = state.courses[cid];
      if(addPicker) draft.sessions = addPicker.getValue(); // legge lo stato attuale delle caselle (ore e campo)
      if(draft.sessions==='none'){ toast('Seleziona almeno un\'ora'); return; }
      const fullSess = sessionsFull(cid, (draft.sessions && draft.sessions!=='none') ? draft.sessions : null, null);
      if(fullSess){ toast(uniqueSessions(courseNow).length>1 ? 'Al completo: '+sessionLabel(fullSess, multiCourt(courseNow)) : 'Corso al completo'); return; }
      try{
        const newRef = push(ref(db, cpath('courseEnrollments/'+cid)));
        const eid = newRef.key;
        const payload = { name, phone, uid: linkedUid, createdAt: Date.now() };
        if(draft.billing==='monthly') payload.billing = 'monthly';
        if(draft.sessions && draft.sessions!=='none') payload.sessions = draft.sessions;
        await set(newRef, payload);
        if(linkedUid) await set(ref(db, cpath('myEnrollments/'+linkedUid+'/'+cid)), eid);
        await update(ref(db, cpath('courses/'+cid)), { enrolledCount: (courseNow.enrolledCount||0)+1 });
        delete state.enrollDraft[cid]; delete state.pickers['enroll-'+cid];
        toast('Corsista aggiunto');
        renderApp();
      }catch(err){ toast('Errore: '+err.message); }
    };
  }

  // Pannello presenze (admin o maestro del corso)
  if(state.attendanceCourseId && state.courses[state.attendanceCourseId] && state.attendanceCourseId===state.selectedCourseId){
    const cid = state.attendanceCourseId;
    const c = state.courses[cid];
    if(state.isAdmin || isTeacherOfCourse(cid)){
      const detailHost = screen.querySelector('#detail-'+cid);
      if(detailHost){
        const enrollments = Object.entries(state.courseEnrollments[cid]||{});
        const attKey = cid+'|'+state.attendanceDate;
        const att = state.courseAttendance[attKey]||{};
        const box = document.createElement('div');
        box.style.marginTop = '12px'; box.style.borderTop='1px solid var(--line)'; box.style.paddingTop='12px';
        box.innerHTML = `
          <div class="section-title">Presenze — ${fmtDateDisplay(state.attendanceDate)}</div>
          <div class="field"><label>Sessione</label><input id="attDate-${cid}" type="date" value="${state.attendanceDate}"></div>
          <div id="attList-${cid}" style="margin-top:8px;"></div>
        `;
        detailHost.appendChild(box);
        box.querySelector('#attDate-'+cid).onchange = (e) => {
          state.attendanceDate = e.target.value;
          loadCourseAttendance(cid, state.attendanceDate);
          renderApp();
        };
        const attListHost = box.querySelector('#attList-'+cid);
        let attHours = courseHoursOn(c, state.attendanceDate);
        if(!attHours.length) attHours = getCourseSessions(c).slice(0,1).map(x=>x.hour);
        if(!attHours.length) attHours = [0];
        if(!enrollments.length){ attListHost.innerHTML = `<div class="hint">Nessun corsista iscritto.</div>`; }
        const realHours = courseHoursOn(c, state.attendanceDate).length > 0;
        const attDow = new Date(state.attendanceDate+'T00:00:00').getDay();
        enrollments.forEach(([eid,e])=>{
          const myHours = realHours ? attHours.filter(h=>enrolleeAttendsSession(e, attDow, h)) : attHours;
          if(!myHours.length) return; // non ha ore in questo giorno
          const row = document.createElement('div'); row.className='list-row';
          const ct0 = myHours.length===1 ? enrolleeCourtName(c, e, attDow, myHours[0]) : '';
          row.innerHTML = `<span>${esc(e.name)}${ct0?` <span class="pill" style="padding:2px 7px;">${esc(ct0)}</span>`:''}</span>`;
          if(myHours.length===1){
            row.appendChild(attendanceButtons(cid, state.attendanceDate, eid, att[eid], myHours[0]));
          } else {
            row.style.flexWrap = 'wrap';
            myHours.forEach(h=>{
              const sub = document.createElement('div');
              sub.style.cssText = 'display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between;padding-top:4px;';
              const ct = enrolleeCourtName(c, e, attDow, h);
              sub.innerHTML = `<span class="hint">${String(h).padStart(2,'0')}:00${ct?' · '+esc(ct):''}</span>`;
              sub.appendChild(attendanceButtons(cid, state.attendanceDate, eid, att[eid], h));
              row.appendChild(sub);
            });
          }
          attListHost.appendChild(row);
        });
        Object.keys(state.courses).forEach(id=>loadCourseRecoveries(id));
        const guests = lessonRecoveries(cid, state.attendanceDate);
        if(guests.length){
          const gh = document.createElement('div'); gh.className='section-title'; gh.style.marginTop='12px';
          gh.textContent = 'Ospiti in recupero ('+guests.length+')';
          attListHost.appendChild(gh);
          guests.forEach(g=>{
            const row = document.createElement('div'); row.className='list-row';
            row.innerHTML = `<span>${esc(g.rec.name)} · ${esc(g.rec.fromCourse||'')}</span><span class="pill">${g.rec.status==='present'?'Presente':(g.rec.status==='absent'?'Assente':'Proposto')}</span>`;
            attListHost.appendChild(row);
          });
        }
      }
    }
  }

  // Pannello assenze e inviti al recupero (admin o maestro del corso)
  if(state.absencesCourseId && state.courses[state.absencesCourseId] && state.absencesCourseId===state.selectedCourseId){
    const cid = state.absencesCourseId;
    const course = state.courses[cid];
    if(state.isAdmin || isTeacherOfCourse(cid)){
      const detailHost = screen.querySelector('#detail-'+cid);
      if(detailHost){
        const enrollments = Object.entries(state.courseEnrollments[cid]||{});
        const history = state.courseAttendanceByCourse[cid] || {};
        loadCourseRecoveries(cid);
        const stats = enrollments.map(([eid,e])=>{
          const presences = Math.max(0, lessonsHeld(course, e) - countAbsences(course, history, eid, e));
          const bl = enrolleeBacklog(cid, eid);
          return { eid, e, absences: bl.absences, recovered: bl.recovered, owed: bl.owed, presences };
        }).sort((a,b)=>b.owed-a.owed || b.absences-a.absences);

        const box = document.createElement('div');
        box.style.marginTop = '12px'; box.style.borderTop='1px solid var(--line)'; box.style.paddingTop='12px';
        box.innerHTML = `
          <div class="section-title">Assenze — ${course.name} (${course.livello||''})</div>
          <div class="hint" style="margin-bottom:8px;">Ordinati per ore ancora da recuperare (assenze meno recuperi confermati dal maestro). Per invitare un corsista al recupero usa la scheda Maestro → Presenze e recuperi.</div>
          <div id="absenceList-${cid}"></div>
        `;
        detailHost.appendChild(box);
        const listHost = box.querySelector('#absenceList-'+cid);
        if(!stats.length){ listHost.innerHTML = `<div class="hint">Nessun dato di presenza ancora registrato.</div>`; }
        stats.forEach(st=>{
          const row = document.createElement('div'); row.className='list-row'; row.style.flexWrap='wrap'; row.style.gap='4px 8px';
          row.innerHTML = `<span>${esc(st.e.name)}</span><span class="pill" style="${st.owed>0?'color:var(--danger);border-color:var(--danger);':''}">${st.absences} assenze · ${st.recovered} recuperate · ${st.presences} presenze</span>`;
          listHost.appendChild(row);
        });
      }
    }
  }

  if(state.isAdmin){
    const resetDraft = () => { state.draftSessions = [{ weekday: 1, hour: OPEN_HOUR, courtId: state.club.courts[0].id }]; };
    const closeForm = () => { state.showCourseForm = false; state.editCourseId = null; state.courseForm = null; delete state.pickers.teacher; delete state.pickers.teacher2; resetDraft(); };
    const newBtn = screen.querySelector('#newCourseBtn');
    if(newBtn) newBtn.onclick = () => { state.showCourseForm = true; state.editCourseId = null; state.courseForm = null; delete state.pickers.teacher; delete state.pickers.teacher2; resetDraft(); renderApp(); };
    const cancelBtn = screen.querySelector('#cancelCourseBtn');
    if(cancelBtn) cancelBtn.onclick = () => { closeForm(); renderApp(); };
    const createBtn = screen.querySelector('#createCourseBtn');
    if(createBtn) createBtn.onclick = async () => {
      const name = screen.querySelector('#cName').value.trim();
      const livello = screen.querySelector('#cLevel').value;
      const teacherUid = (state.pickers.teacher||{}).value || '';
      const teacherName = teacherUid ? (allLinkedMembers.find(([_,m])=>m.uid===teacherUid)||[])[1]?.name : '';
      const teacherUid2 = (state.pickers.teacher2||{}).value || '';
      const teacherName2 = teacherUid2 ? (allLinkedMembers.find(([_,m])=>m.uid===teacherUid2)||[])[1]?.name : '';
      if(teacherUid2 && teacherUid2===teacherUid){ toast('Il secondo maestro deve essere diverso dal primo'); return; }
      if(teacherUid2 && !teacherUid){ toast('Seleziona prima il maestro principale'); return; }
      const startDate = screen.querySelector('#cStart').value;
      const endDate = screen.querySelector('#cEnd').value;
      const maxSeats = parseInt(screen.querySelector('#cMax').value,10) || 8;
      const monthlyFee = parseFloat(screen.querySelector('#cFee').value) || 0;
      const sessions = state.draftSessions.map(x=>({ weekday:x.weekday, hour:x.hour, courtId:x.courtId }));
      if(!name) return toast('Inserisci il nome del corso');
      if(!startDate || !endDate){ toast('Inserisci data inizio e fine'); return; }
      if(!sessions.length){ toast('Aggiungi almeno un giorno'); return; }
      try{
        if(teacherUid && !state.teachers[teacherUid]){
          await set(ref(db, cpath('teachers/'+teacherUid)), true);
        }
        if(teacherUid2 && !state.teachers[teacherUid2]){
          await set(ref(db, cpath('teachers/'+teacherUid2)), true);
        }
        if(edCourse){
          const enrolled = edCourse.enrolledCount || 0;
          if(maxSeats < enrolled){ toast('I posti massimi non possono essere meno degli iscritti ('+enrolled+')'); return; }
          await update(ref(db, cpath('courses/'+state.editCourseId)), {
            name, livello, teacherUid: teacherUid||null, teacherName: teacherName||'', teacherUid2: teacherUid2||null, teacherName2: teacherName2||'',
            sessions, startDate, endDate, maxSeats, monthlyFee
          });
          toast('Corso aggiornato');
        } else {
          const newRef = push(ref(db, cpath('courses')));
          await set(newRef, {
            name, livello, teacherUid: teacherUid||null, teacherName: teacherName||'', teacherUid2: teacherUid2||null, teacherName2: teacherName2||'',
            sessions, startDate, endDate, maxSeats, monthlyFee,
            enrolledCount: 0, createdAt: Date.now()
          });
          state.selectedCourseId = newRef.key;
          toast('Corso creato');
        }
        closeForm();
        renderApp();
      }catch(e){ toast('Errore: '+e.message); }
    };
  }
}

function nextSessionDate(course){
  const weekdays = getCourseSessions(course).map(s=>s.weekday);
  const now = new Date();
  for(let i=0;i<8;i++){
    const d = new Date(now); d.setDate(d.getDate()+i);
    if(weekdays.includes(d.getDay())){
      const k = dateKey(d);
      if(k>=course.startDate && k<=course.endDate) return k;
      return k; // fuori range ma ragionevole come default
    }
  }
  return todayKey();
}

/* ================= Vista Maestro ================= */
function renderMaestroScreen(host){
  if(!state.maestroWeekStart) state.maestroWeekStart = mondayOf(todayKey());
  const weekDays = Array.from({length:7}, (_,i)=>addDays(state.maestroWeekStart, i));

  const myCourses = Object.entries(state.courses||{}).filter(([_,c])=>c.teacherUid===state.uid || c.teacherUid2===state.uid);

  myCourses.forEach(([cid])=>{ loadCourseEnrollments(cid); loadCourseAttendanceAll(cid); });
  Object.keys(state.courses||{}).forEach(id=>loadCourseRecoveries(id));

  let weekHours = 0, weekRevenue = 0;
  const dayData = weekDays.map(dateStr=>{
    const lessons = Object.entries(state.myTeachingBookings||{})
      .filter(([_,l])=>l.date===dateStr).sort((a,b)=>a[1].hour-b[1].hour);
    const dow = new Date(dateStr+'T00:00:00').getDay();
    const sessions = [];
    myCourses.forEach(([cid,c])=>{
      if(dateStr < c.startDate || dateStr > c.endDate) return;
      getCourseSessions(c).filter(s=>s.weekday===dow).forEach(s=>{
        const court = (state.club.courts||[]).find(x=>x.id===s.courtId);
        sessions.push({ cid, dateStr, hour: s.hour, courtId: s.courtId, courtName: court?court.name:'', courseName: c.name, enrolled: (c.seatsTaken && c.seatsTaken[sessionKey(s.weekday,s.hour,s.courtId)]!=null) ? c.seatsTaken[sessionKey(s.weekday,s.hour,s.courtId)] : ((c.seatsTaken && c.seatsTaken[sessionKey(s.weekday,s.hour)]!=null) ? c.seatsTaken[sessionKey(s.weekday,s.hour)] : (c.enrolledCount||0)) });
      });
    });
    sessions.sort((a,b)=>a.hour-b.hour);
    const hours = lessons.length;
    const revenue = lessons.reduce((sum,[_,l])=>sum+(typeof l.rate==='number'?l.rate:0),0);
    weekHours += hours; weekRevenue += revenue;
    return { dateStr, lessons, sessions, hours, revenue };
  });

  // giorno selezionato (di default oggi, se è nella settimana mostrata)
  if(!state.maestroDay || !weekDays.includes(state.maestroDay)){
    state.maestroDay = weekDays.includes(todayKey()) ? todayKey() : weekDays[0];
  }
  const selDay = state.maestroDay;
  const MON = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const pt = d => { const [,m,dd] = d.split('-').map(Number); return { d:dd, m:m-1 }; };
  const pa = pt(weekDays[0]), pb = pt(weekDays[6]);
  const rangeTxt = pa.m===pb.m ? `${pa.d} – ${pb.d} ${MON[pb.m]}` : `${pa.d} ${MON[pa.m]} – ${pb.d} ${MON[pb.m]}`;

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="card">
      <div class="wk-head">
        <div>
          <div class="wk-title">Il tuo calendario</div>
          <div class="wk-sub">${weekDays.includes(todayKey()) ? 'Questa settimana' : 'Settimana'} · ${rangeTxt}</div>
        </div>
        <div class="wk-nav">
          <button id="prevWeek" aria-label="Settimana precedente">‹</button>
          <button id="nextWeek" aria-label="Settimana successiva">›</button>
        </div>
      </div>
      <div class="mt-sum"><span>Settimana: <b>${weekHours}h</b> di lezioni private</span><button class="mt-today" id="thisWeek">Oggi</button></div>
      <div class="mt-strip" id="dayStrip"></div>
    </div>
    <div class="card" id="dayCard"></div>
    <div class="hint">Le quote dei corsi sono mensili e vengono gestite dall'admin nella tab Corsi — qui vedi solo gli orari.</div>
  `;
  host.replaceChildren(screen);

  const resetOpen = () => { state.maestroOpenKey = null; state.recoverySession = null; };
  screen.querySelector('#prevWeek').onclick = () => { state.maestroWeekStart = addDays(state.maestroWeekStart, -7); state.maestroDay = addDays(selDay, -7); resetOpen(); renderApp(); };
  screen.querySelector('#nextWeek').onclick = () => { state.maestroWeekStart = addDays(state.maestroWeekStart, 7); state.maestroDay = addDays(selDay, 7); resetOpen(); renderApp(); };
  screen.querySelector('#thisWeek').onclick = () => { state.maestroWeekStart = mondayOf(todayKey()); state.maestroDay = todayKey(); resetOpen(); renderApp(); };

  // striscia dei giorni
  const strip = screen.querySelector('#dayStrip');
  dayData.forEach(dd=>{
    const dow = new Date(dd.dateStr+'T00:00:00').getDay();
    const n = dd.lessons.length + dd.sessions.length;
    const b = document.createElement('button');
    b.className = 'mt-day' + (dd.dateStr===selDay?' sel':'') + (dd.dateStr===todayKey()?' today':'') + (n?'':' empty');
    b.innerHTML = `<span class="dw">${WEEKDAY_FULL[dow].slice(0,3)}</span><span class="dn">${pt(dd.dateStr).d}</span><span class="cnt">${n||''}</span>`;
    b.onclick = () => { state.maestroDay = dd.dateStr; resetOpen(); renderApp(); };
    strip.appendChild(b);
  });

  // giornata selezionata
  const d = dayData.find(x=>x.dateStr===selDay);
  const dow = new Date(selDay+'T00:00:00').getDay();
  const dayCard = screen.querySelector('#dayCard');
  const total = d.lessons.length + d.sessions.length;
  dayCard.innerHTML = `
    <div class="mt-dayhead">
      <div class="mt-daytitle">${WEEKDAY_FULL[dow]} ${pt(selDay).d} ${IT_MONTHS[pt(selDay).m]}${selDay===todayKey()?' · oggi':''}</div>
      <div class="hint">${total ? total+(total===1?' impegno':' impegni') : ''}</div>
    </div>
    <div id="mtItems"></div>
    ${d.hours ? `<div class="list-row"><span>Lezioni private</span><span class="pill">${d.hours}h</span></div>` : ''}`;
  const itemsHost = dayCard.querySelector('#mtItems');
  if(!total){ itemsHost.innerHTML = `<div class="mt-empty">Niente in programma</div>`; return; }

  const items = [
    ...d.lessons.map(([bid,l])=>({ type:'lesson', hour:l.hour, l })),
    ...d.sessions.map(s=>({ type:'session', hour:s.hour, s }))
  ].sort((x,y)=> x.hour-y.hour || (x.type==='lesson'?-1:1));
  const pad = h => String(h).padStart(2,'0')+':00';

  items.forEach(it=>{
    const card = document.createElement('div');
    if(it.type==='lesson'){
      const l = it.l;
      card.className = 'mt-item static';
      card.innerHTML = `<div class="mt-head"><div class="mt-time">${pad(l.hour)}</div>
        <div class="mt-meta"><div class="mt-name">${esc(l.clientName||'—')}</div><div class="mt-sub">Lezione privata${l.courtName?' · '+esc(l.courtName):''}</div></div>
        </div>`;
      itemsHost.appendChild(card);
      return;
    }
    const s = it.s;
    const key = [s.cid, s.dateStr, s.hour, s.courtId||''].join('|');
    const rs = state.recoverySession;
    const recoOpen = !!rs && rs.cid===s.cid && rs.date===s.dateStr && rs.hour===s.hour && (rs.courtId||'')===(s.courtId||'');
    const isOpen = recoOpen || state.maestroOpenKey===key;

    const enr = Object.entries(state.courseEnrollments[s.cid]||{}).filter(([_,e])=>enrolleeAttendsSession(e, dow, s.hour, s.courtId));
    const dayAtt = (state.courseAttendanceByCourse[s.cid]||{})[s.dateStr] || {};
    const names = (test)=>enr.filter(([eid])=>test(attGet(dayAtt[eid], s.hour))).map(([_,e])=>esc(e.name||'—')).join(', ');
    const pres = enr.filter(([eid])=>attGet(dayAtt[eid], s.hour)===true).length;
    const abs = enr.filter(([eid])=>attGet(dayAtt[eid], s.hour)===false).length;
    const none = enr.length - pres - abs;
    const guests = lessonRecoveries(s.cid, s.dateStr, s.hour, s.courtId);
    const hl = lessonHoles(s.cid, s.dateStr, s.hour, s.courtId);

    const chips = [];
    if(!enr.length) chips.push(`<span class="mt-chip">nessun iscritto</span>`);
    if(pres) chips.push(`<span class="mt-chip ok">${pres} ${pres===1?'presente':'presenti'}</span>`);
    if(abs) chips.push(`<span class="mt-chip no">${abs} ${abs===1?'assente':'assenti'}</span>`);
    if(none>0 && enr.length) chips.push(`<span class="mt-chip">${none} senza risposta</span>`);
    if(guests.length) chips.push(`<span class="mt-chip">${guests.length} ${guests.length===1?'recupero':'recuperi'}</span>`);
    if(hl.holes>0) chips.push(`<span class="mt-chip hole">${hl.holes} ${hl.holes===1?'posto da riempire':'posti da riempire'}</span>`);

    card.className = 'mt-item' + (isOpen ? ' open' : '');
    card.innerHTML = `<div class="mt-head"><div class="mt-time">${pad(s.hour)}</div>
      <div class="mt-meta"><div class="mt-name">${esc(s.courseName)}</div><div class="mt-sub">Corso${s.courtName?' · '+esc(s.courtName):''} · ${s.enrolled} iscritti</div></div>
      <span class="mt-chev">›</span></div>
      <div class="mt-chips">${chips.join('')}</div>`;
    card.querySelector('.mt-head').onclick = () => {
      if(isOpen){ state.maestroOpenKey = null; if(recoOpen) state.recoverySession = null; }
      else { state.maestroOpenKey = key; state.recoverySession = null; }
      renderApp();
    };

    if(isOpen){
      const det = document.createElement('div'); det.className = 'mt-detail';
      const lines = [];
      if(pres) lines.push(`<div><span class="pill" style="color:var(--ball);border-color:var(--ball);">Presenti (${pres})</span>${names(v=>v===true)}</div>`);
      if(abs) lines.push(`<div><span class="pill" style="color:var(--danger);border-color:var(--danger);">Assenti (${abs})</span>${names(v=>v===false)}</div>`);
      if(none>0 && enr.length) lines.push(`<div><span class="pill">Senza risposta (${none})</span>${names(v=>v===undefined)}</div>`);
      if(guests.length) lines.push(`<div><span class="pill">Recuperi (${guests.length})</span>${guests.map(g=>esc(g.rec.name||'—')+' ('+(g.rec.status==='present'?'presente':(g.rec.status==='absent'?'assente':'proposto'))+')').join(', ')}</div>`);
      if(lines.length){
        const blk = document.createElement('div'); blk.className = 'cal-att'; blk.innerHTML = lines.join('');
        det.appendChild(blk);
      } else {
        det.innerHTML = `<div class="hint">Nessuna presenza registrata per ora.</div>`;
      }
      const tog = document.createElement('button');
      tog.className = 'btn-ghost';
      tog.style.cssText = 'width:100%;margin-top:6px;padding:9px;font-size:12px;';
      tog.textContent = recoOpen ? 'Chiudi presenze e recuperi' : 'Presenze e recuperi';
      tog.onclick = () => {
        state.recoverySession = recoOpen ? null : { cid:s.cid, date:s.dateStr, hour:s.hour, courtId:s.courtId };
        state.maestroOpenKey = key;
        state.recoLimit = 15; state.recoScroll = 0; state.recoSearch = ''; state.recoAll = false;
        renderApp();
      };
      det.appendChild(tog);
      if(recoOpen){
        const panel = buildRecoveryPanel(s.cid, s.dateStr, s.hour, s.courtId);
        det.appendChild(panel);
        if(panel._restore) panel._restore();
      }
      card.appendChild(det);
    }
    itemsHost.appendChild(card);
  });
}

/* ================= Vista Registro (super admin, nascosta) ================= */
function renderSuperAdminScreen(host){

  screen.querySelector('#auditToInput').onchange = (e)=>{ state.auditTo = e.target.value; renderApp(); };
  const clearBtn = screen.querySelector('#auditClearDates');
  if(clearBtn) clearBtn.onclick = () => { state.auditFrom=''; state.auditTo=''; renderApp(); };

  const listHost = screen.querySelector('#auditList');

  filtered.forEach(([id,e])=>{

    const row = document.createElement('div'); row.className='list-row';
    const rateDetail = e.type==='modifica_quota' ? ` · € ${(e.oldRate||0).toFixed(2)} → € ${(e.newRate||0).toFixed(2)}${e.reason?' · motivo: '+e.reason:''}` : '';
    row.innerHTML = `<span>

/* ================= Vista Soci ================= */
function renderMembersScreen(host){

      <div id="memList"></div>

/* ================= Dettaglio socio per admin (quota + debito + punti fedeltà) ================= */
function renderMemberDetailModal(m){
  loadMembershipFeeForMember(m.uid);
  loadDebtForMember(m.uid);
  loadLoyaltyForMember(m.uid);
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
  const curYear = new Date().getFullYear();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h4>${m.name}</h4>
      <div id="memberFeeStatus"></div>
      <div class="field" style="margin-top:8px;"><label>Importo (€)</label><input id="memberFeeAmount" type="number" min="0" step="1"></div>
      <button class="btn-primary" id="memberFeeSaveBtn" style="width:100%;margin-top:6px;">Segna pagata</button>
      <div class="section-title" style="margin-top:8px;">Debito con il circolo</div>
      <div id="memberDebtStatus"></div>
      <div class="field" style="margin-top:8px;"><label>Nuovo importo debito (€)</label><input id="memberDebtAmount" type="number" min="0" step="0.5"></div>
      <div class="hint">Imposta 0 per azzerarlo.</div>
      <button class="btn-primary" id="memberDebtSaveBtn" style="width:100%;margin-top:6px;">Aggiorna debito</button>
      <div class="section-title" style="margin-top:8px;">Raccolta punti</div>
      <div id="memberLoyaltyHost"><div class="hint">Caricamento…</div></div>
      <button class="btn-ghost" id="closeMemberDetail">Chiudi</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeMemberDetail').onclick = () => overlay.remove();

  const amountInput = overlay.querySelector('#memberFeeAmount');
  const statusHost = overlay.querySelector('#memberFeeStatus');
  let amountPrefilled = false;

  overlay.querySelector('#memberFeeSaveBtn').onclick = async () => {
    const amount = parseFloat(amountInput.value);
    if(isNaN(amount) || amount<0){ toast('Inserisci un importo valido'); return; }
    try{
      await update(ref(db, cpath('membershipFees/'+m.uid+'/'+curYear)), { amount, paidAt: Date.now() });
      toast('Quota segnata come pagata');
    }catch(e){ toast('Errore: '+e.message); }
  };

  const debtAmountInput = overlay.querySelector('#memberDebtAmount');
  const debtStatusHost = overlay.querySelector('#memberDebtStatus');
  let debtPrefilled = false;

  overlay.querySelector('#memberDebtSaveBtn').onclick = async () => {
    const amount = parseFloat(debtAmountInput.value);
    if(isNaN(amount) || amount<0){ toast('Inserisci un importo valido'); return; }
    try{
      await update(ref(db, cpath('memberDebts/'+m.uid)), { total: amount, updatedAt: Date.now() });
      toast(amount===0 ? 'Debito azzerato' : 'Debito aggiornato');
    }catch(e){ toast('Errore: '+e.message); }
  };

  // Aggiorna solo le parti in sola lettura: non tocca mai gli input mentre l'admin ci scrive dentro
  function refreshReadOnly(){
    if(!document.body.contains(overlay)) return false;
    const scan = state.adminMembershipFees[m.uid];
    if(scan !== undefined){
      const fee = scan[curYear];
      statusHost.innerHTML = `<div class="list-row"><span>Quota sociale ${curYear}</span><span class="pill" style="${fee?.paidAt?'':'color:var(--danger);border-color:var(--danger);'}">${fee?.paidAt ? 'Pagata · € '+fee.amount.toFixed(2) : 'Da pagare'}</span></div>`;
      if(!amountPrefilled && fee?.amount!==undefined){
        amountInput.value = fee.amount;
        amountPrefilled = true;
      }
    }
    const debtTotal = state.adminMemberDebts[m.uid];
    if(debtTotal !== undefined){
      debtStatusHost.innerHTML = `<div class="list-row"><span>Debito attuale</span><span class="pill" style="${debtTotal>0?'color:var(--danger);border-color:var(--danger);':''}">€ ${debtTotal.toFixed(2)}</span></div>`;
      if(!debtPrefilled){
        debtAmountInput.value = debtTotal;
        debtPrefilled = true;
      }
    }
    const loyaltyScan = state.adminLoyaltyScan[m.uid];
    if(loyaltyScan && loyaltyScan.confirmed!==undefined && loyaltyScan.redemptions!==undefined){
      const progress = computeLoyaltyProgress(loyaltyScan.confirmed, loyaltyScan.redemptions);
      overlay.querySelector('#memberLoyaltyHost').innerHTML = progress.map(loyaltyBarHtml).join('');
    }
    return scan!==undefined && debtTotal!==undefined && loyaltyScan && loyaltyScan.confirmed!==undefined && loyaltyScan.redemptions!==undefined;
  }

  if(!refreshReadOnly()){
    let ticks = 0;
    const interval = setInterval(()=>{
      ticks++;
      const stillOpen = document.body.contains(overlay);
      if(!stillOpen || refreshReadOnly() || ticks>20) clearInterval(interval);
    }, 400);
  }
}

/* ================= Admin ================= */
function renderAdminScreen(host){
  if(!state.isAdmin){
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.innerHTML = `<div class="card"><div class="hint">Non sei amministratore di questo circolo. Chiedi a un amministratore esistente di promuoverti dalla sezione Soci → Amministratori.</div></div>`;
    host.replaceChildren(screen);
    return;
  }

  const now = new Date();
  const absenceThreshold = (state.club && state.club.absenceThreshold) || 2;

  // Scansione premi fedeltà da riscattare
  const linkedMembersForLoyalty = Object.entries(state.members||{}).filter(([_,m])=>m.uid);
  linkedMembersForLoyalty.forEach(([_,m])=> loadLoyaltyForMember(m.uid));
  const loyaltyBandsAdmin = getLoyaltyBands();
  const premiDaRiscattare = [];
  linkedMembersForLoyalty.forEach(([mid,m])=>{
    const scan = state.adminLoyaltyScan[m.uid];
    if(!scan || !scan.confirmed) return;
    const confirmedList = Object.values(scan.confirmed);
    loyaltyBandsAdmin.forEach(band=>{
      const count = confirmedList.filter(c=>c.band===band.id).length;
      const earned = Math.floor(count / band.threshold);
      const redeemed = (scan.redemptions||{})[band.id] || 0;
      const available = earned - redeemed;
      if(available > 0){
        premiDaRiscattare.push({ uid: m.uid, name: m.name, band, available });
      }
    });
  });

  let periodStart, periodEnd;
  if(state.adminPeriod==='oggi'){
    periodStart = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    periodEnd = new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
  } else if(state.adminPeriod==='settimana'){
    periodStart = new Date(now.getTime()-7*24*3600*1000);
    periodEnd = now;
  } else if(state.adminPeriod==='custom'){
    periodStart = new Date((state.customFrom||todayKey())+'T00:00:00');
    periodEnd = new Date((state.customTo||todayKey())+'T23:59:59');
  } else {
    periodStart = new Date(0);
    periodEnd = now;
  }

  const allPrivate = Object.entries(state.bookingsPrivate||{});
  const inPeriod = allPrivate.filter(([_,b])=> {
    const t = slotDateTime(b.date,b.hour);
    return t >= periodStart && t <= periodEnd;
  });
  let totHours = inPeriod.length;
  const byMode = {}; ALL_MODES.forEach(m=> byMode[m.id] = {hours:0, revenue:0});
  let totRevenue = 0;
  inPeriod.forEach(([_,b])=>{
    const mode = b.mode || 'normale';
    if(!byMode[mode]) byMode[mode] = {hours:0,revenue:0};
    byMode[mode].hours += 1;
    const r = (typeof b.rate === 'number') ? b.rate : (state.club.rates[mode]||0);
    byMode[mode].revenue += r; totRevenue += r;
  });
  Object.values(state.recurringBookings||{}).forEach(r=>{
    const occ = countRecurringOccurrences(r, periodStart, periodEnd);
    if(occ<=0) return;
    totHours += occ;
    const mode = r.mode || 'normale';
    if(!byMode[mode]) byMode[mode] = {hours:0,revenue:0};
    byMode[mode].hours += occ;
    const rate = (typeof r.rate === 'number') ? r.rate : (state.club.rates[mode]||0);
    byMode[mode].revenue += occ*rate; totRevenue += occ*rate;
  });

  const dayBookings = allPrivate.filter(([_,b])=>b.date===state.selectedDate).sort((a,b)=>a[1].hour-b[1].hour);
  const byTeacherToday = {};
  dayBookings.forEach(([_,b])=>{
    if(b.mode!=='lezione' || !b.teacherName) return;
    if(!byTeacherToday[b.teacherName]) byTeacherToday[b.teacherName] = {hours:0, revenue:0};
    byTeacherToday[b.teacherName].hours += 1;
    byTeacherToday[b.teacherName].revenue += (typeof b.rate==='number'?b.rate:(state.club.rates.lezione||0));
  });
  const dayRecurring = Object.entries(state.recurringBookings||{}).filter(([_,r])=>recurringActiveOnDate(r, state.selectedDate));

  // Cronologia: prenotazioni di un giorno passato, sola lettura
  const historyBookings = allPrivate.filter(([_,b])=>b.date===state.historyDate).sort((a,b)=>a[1].hour-b[1].hour);
  const historyRecurring = Object.entries(state.recurringBookings||{}).filter(([_,r])=>recurringActiveOnDate(r, state.historyDate)).sort((a,b)=>a[1].hour-b[1].hour);
  const memberList = Object.entries(state.members||{}).sort((a,b)=>a[1].name.localeCompare(b[1].name));

  // Statistiche cancellazioni last-minute (stesso giorno)
  const cancelEntries = Object.values(state.cancellationStats||{});
  const sameDayCancels = cancelEntries.filter(c=>c.sameDay);
  const byMemberCancel = {};
  sameDayCancels.forEach(c=>{
    const name = c.forMemberName || 'Sconosciuto';
    byMemberCancel[name] = (byMemberCancel[name]||0)+1;
  });
  const memberCancelStats = Object.entries(byMemberCancel).sort((a,b)=>b[1]-a[1]);
  const byHourCancel = {};
  sameDayCancels.forEach(c=>{
    byHourCancel[c.hour] = (byHourCancel[c.hour]||0)+1;
  });
  const hourCancelStats = Object.entries(byHourCancel).sort((a,b)=>b[1]-a[1]);

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="card">
      <div class="section-title">Contabilità ore e incasso</div>
      <div class="period-strip">
        <button data-p="oggi" class="${state.adminPeriod==='oggi'?'sel':''}">Oggi</button>
        <button data-p="settimana" class="${state.adminPeriod==='settimana'?'sel':''}">7 giorni</button>
        <button data-p="custom" class="${state.adminPeriod==='custom'?'sel':''}">Personalizzato</button>
      </div>
      ${state.adminPeriod==='custom' ? `
      <div style="display:flex;gap:8px;margin-top:8px;">
        <div class="field"><label>Da</label><input id="customFromInput" type="date" value="${state.customFrom}"></div>
        <div class="field"><label>A</label><input id="customToInput" type="date" value="${state.customTo}"></div>
      </div>
      <div class="hint" style="margin-top:4px;">${fmtDateDisplay(state.customFrom)} → ${fmtDateDisplay(state.customTo)}</div>
      ` : ''}
      <div id="modeBreakdown" style="margin-top:10px;"></div>
      <div class="totale-box"><span class="l">Ore totali</span><span class="v">${totHours}h</span></div>
      <div class="totale-box"><span class="l">Incasso stimato</span><span class="v">€ ${totRevenue.toFixed(2)}</span></div>
    </div>

    <div class="card">
      <div class="section-title">Tariffe (€/ora)</div>
      <div id="ratesHost"></div>
      <button class="btn-ghost" id="saveRatesBtn" style="width:100%;margin-top:10px;">Salva tariffe</button>
    </div>

    <div class="card">
      <div class="section-title">Prenotazioni del ${fmtDateDisplay(state.selectedDate)} (${dayBookings.length + dayRecurring.length})</div>
      ${Object.keys(byTeacherToday).length ? `<div class="hint" style="margin-bottom:6px;">Incasso lezioni per maestro:</div>${Object.entries(byTeacherToday).map(([name,d])=>`<div class="list-row"><span>${name}</span><span class="pill">${d.hours}h · € ${d.revenue.toFixed(2)}</span></div>`).join('')}` : ''}
      <div id="bookingsHost">${(dayBookings.length||dayRecurring.length) ? '' : '<div class="hint">Nessuna prenotazione.</div>'}</div>
    </div>

    <div class="card">
      <div class="section-title">Cronologia prenotazioni</div>
      <div class="hint" style="margin-bottom:8px;">Consulta un giorno passato — sola lettura, nessuna modifica o cancellazione da qui.</div>
      <div class="field"><label>Giorno</label><input id="historyDateInput" type="date" value="${state.historyDate}" max="${todayKey()}"></div>
      <div class="hint" style="margin:6px 0;">${fmtDateDisplay(state.historyDate)} · ${historyBookings.length + historyRecurring.length} ore</div>
      <div id="historyList">${(historyBookings.length||historyRecurring.length) ? '' : '<div class="hint">Nessuna prenotazione in questo giorno.</div>'}</div>
    </div>

    <div class="card">
      <div class="section-title">Blocca uno slot (manutenzione / chiusura)</div>
      <div class="field"><label>Campo</label>
        <select id="blockCourt">${(state.club.courts||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Ora</label>
        <select id="blockHour">${Array.from({length:CLOSE_HOUR-OPEN_HOUR},(_,i)=>{const h=OPEN_HOUR+i;return `<option value="${h}">${String(h).padStart(2,'0')}:00</option>`;}).join('')}</select>
      </div>
      <button class="btn-clay" id="blockBtn" style="width:100%;margin-top:8px;">Blocca slot per il ${fmtDateDisplay(state.selectedDate)}</button>
    </div>

    <div class="card">
      <div class="section-title">Prenotazioni fisse (ricorrenti)</div>
      <div class="hint" style="margin-bottom:8px;">Si ripetono ogni settimana lo stesso giorno e ora. Solo l'admin può crearle o rimuoverle — pensate per accordi presi direttamente con la segreteria.</div>
      <div id="recurringList"></div>

        </select>

      <div class="field" id="recGuestWrap"><label>Nome</label><input id="recGuestName" placeholder="Nome e cognome"></div>
      <div class="field"><label>Campo</label>

  screen.querySelector('#addAdminBtn').onclick = async () => {
    const uid = (state.pickers.addAdmin||{}).value;
    if(!uid){ toast('Scegli prima un socio'); return; }
    try{ await set(ref(db, cpath('admins/'+uid)), true); delete state.pickers.addAdmin; }catch(e){ toast('Errore: '+e.message); }
  };

  // Maestri: solo i maestri attuali + menu per aggiungerne
  const teacherListHost = screen.querySelector('#teacherList');
  const currentTeachers = linkedMembers.filter(([_,m])=>state.teachers[m.uid]);
  if(!currentTeachers.length) teacherListHost.appendChild(emptyHint('Nessun maestro.'));
  currentTeachers.forEach(([id,m])=>{
    const uid = m.uid;
    const row = document.createElement('div'); row.className='member-row';
    row.innerHTML = `<span class="name">${esc(m.name)}</span><span class="pill" style="border-color:var(--clay-dim);color:var(--clay);">Maestro</span>`;
    const btn = document.createElement('button');
    btn.className = 'small-btn';
    btn.textContent = 'Rimuovi maestro';
    btn.onclick = async () => {
      try{ await remove(ref(db, cpath('teachers/'+uid))); }catch(e){ toast('Errore: '+e.message); }
    };
    row.appendChild(btn);
    teacherListHost.appendChild(row);
  });
  screen.querySelector('#addTeacherPickerHost').appendChild(makePicker('addTeacher',
    linkedMembers.filter(([_,m])=>!state.teachers[m.uid]).map(([_,m])=>({ value:m.uid, label:m.name })),
    { placeholder:'Cerca socio…', noneLabel:'— scegli un socio —' }));
  screen.querySelector('#addTeacherBtn').onclick = async () => {
    const uid = (state.pickers.addTeacher||{}).value;
    if(!uid){ toast('Scegli prima un socio'); return; }
    try{ await set(ref(db, cpath('teachers/'+uid)), true); delete state.pickers.addTeacher; }catch(e){ toast('Errore: '+e.message); }
  };

  screen.querySelector('#saveWaBtn').onclick = async () => {
    const template = screen.querySelector('#waTemplate').value.trim();
    const groupName = screen.querySelector('#waGroupName').value.trim();
    try{
      await update(ref(db, cpath('info')), { whatsappTemplate: template, whatsappGroupName: groupName });
      toast('Impostazioni salvate');
    }catch(e){ toast('Errore: '+e.message); }
  };
}

boot();
</script>
</body>
</html>
