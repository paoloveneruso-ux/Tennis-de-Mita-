<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tennis Club Lello de Mita — Campi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EFEEE6;--ink-dim:#A9B3AC;--board:#122019;--board-2:#182B22;--board-3:#1F3A2C;--line:#33493C;
    --clay:#B5602F;--clay-dim:#7C4726;--chalk:#F4F1E6;--ball:#D7E85C;--ball-dim:#7C8534;--danger:#C1533B;
    --radius:10px;--font-display:'Oswald',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--board);
    background-image:radial-gradient(circle at 15% 0%, rgba(215,232,92,0.05), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:40px;}
  .court-header{padding:22px 18px 14px;border-bottom:1px solid var(--line);position:relative;}
  .header-profile{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px;}
  .header-profile .link{padding:0;}
  .court-header .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ball);opacity:.85;margin-bottom:6px;}
  .court-header h1{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.01em;margin:0;text-transform:uppercase;}
  .court-line{height:2px;background:linear-gradient(90deg,var(--clay),transparent 70%);margin-top:14px;position:relative;}
  .court-line::before{content:"";position:absolute;left:0;top:-5px;width:2px;height:12px;background:var(--clay);}
  .court-line::after{content:"";position:absolute;right:0;top:-5px;width:2px;height:12px;background:var(--clay);opacity:.15;}
  .screen{padding:18px;flex:1;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--board-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);}
  input,select{background:var(--board);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 12px;font-size:15px;font-family:var(--font-body);width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--ball-dim);}
  button{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;font-weight:600;border:none;border-radius:8px;padding:12px 16px;font-size:14px;cursor:pointer;transition:transform .1s ease, opacity .15s;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.35;cursor:default;}
  .btn-primary{background:var(--ball);color:#16220F;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--danger);color:var(--chalk);}
  .btn-clay{background:var(--clay);color:var(--chalk);}
  .hint{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .error-box{background:rgba(193,83,59,.12);border:1px solid var(--danger);color:#F0B3A6;padding:10px 12px;border-radius:8px;font-size:13px;}
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--board-2);position:sticky;bottom:0;}
  .tabbar button{flex:1;background:transparent;border:none;border-radius:0;color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:13px 6px;}
  .tabbar button.active{color:var(--ball);}
  .day-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .day-chip{flex:0 0 auto;background:var(--board);border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-align:center;min-width:56px;cursor:pointer;}
  .day-chip .d{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);text-transform:uppercase;}
  .day-chip .n{font-family:var(--font-display);font-size:18px;}
  .day-chip.active{border-color:var(--ball);background:rgba(215,232,92,.08);}
  .day-chip.active .d,.day-chip.active .n{color:var(--ball);}
  .court-block{margin-bottom:18px;}
  .court-block h3{font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;color:var(--chalk);display:flex;align-items:center;gap:8px;}
  .court-block h3::before{content:"";width:10px;height:10px;border:1.5px solid var(--clay);border-radius:2px;}
  .slot-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;}
  .slot{font-family:var(--font-mono);font-size:12.5px;text-align:center;padding:9px 4px;border-radius:6px;border:1px solid var(--line);background:var(--board);color:var(--ink-dim);cursor:pointer;position:relative;}
  .slot.free:hover{border-color:var(--ball-dim);}
  .slot.mine{background:rgba(215,232,92,.14);border-color:var(--ball);color:var(--ball);font-weight:600;}
  .slot.taken{background:rgba(255,255,255,.03);color:var(--ink-dim);cursor:default;opacity:.6;}
  .slot.taken .who{display:block;font-size:9px;margin-top:2px;opacity:.8;}
  .slot.blocked{background:repeating-linear-gradient(45deg,var(--board),var(--board) 4px,rgba(193,83,59,.15) 4px,rgba(193,83,59,.15) 8px);color:#C99;cursor:default;border-color:var(--clay-dim);}
  .slot.past{opacity:.25;cursor:default;}
  .slot{min-width:0;overflow:hidden;}
  .slot.blocked .who{display:block;font-size:9px;margin-top:2px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot .who{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* calendario settimanale del corsista */
  .wk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .wk-title{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:var(--chalk);line-height:1.1;}
  .wk-sub{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ball);margin-top:4px;}
  .wk-nav{display:flex;gap:8px;flex-shrink:0;}
  .wk-nav button{width:38px;height:38px;border-radius:50%;background:var(--board);border:1px solid var(--line);color:var(--ink);font-size:20px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;}
  .wk-nav button:disabled{opacity:.35;cursor:default;}
  .wk-info{font-size:12.5px;line-height:1.45;color:var(--ink-dim);background:var(--board);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;}
  .wk-info b{color:var(--chalk);font-weight:600;}
  .wk-empty{text-align:center;color:var(--ink-dim);font-size:13px;padding:22px 0 10px;}
  .wk-day{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
  .wk-day:first-of-type{border-top:none;padding-top:2px;}
  .wk-date{flex:0 0 46px;text-align:center;border-radius:10px;background:var(--board);border:1px solid var(--line);padding:6px 0 7px;}
  .wk-date .dw{display:block;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);}
  .wk-date .dn{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1;color:var(--chalk);}
  .wk-day.today .wk-date{background:var(--ball);border-color:var(--ball);}
  .wk-day.today .wk-date .dw,.wk-day.today .wk-date .dn{color:#122019;}
  .wk-lessons{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .wk-lesson{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--board-2);border:1px solid var(--line);}
  .wk-lesson.absent{background:rgba(193,83,59,.10);border-color:var(--danger);}
  .wk-time{font-family:var(--font-display);font-size:21px;letter-spacing:.02em;color:var(--chalk);flex:0 0 auto;}
  .wk-meta{flex:1 1 90px;min-width:0;}
  .wk-name{font-weight:600;font-size:14px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wk-court{font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .wk-act{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;}
  .wk-badge{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:4px 10px;border:1px solid var(--ball-dim);color:var(--ball);white-space:nowrap;}
  .wk-badge.abs{border-color:var(--danger);color:var(--danger);}
  .wk-btn{padding:9px 14px;font-size:13px;border-radius:8px;white-space:nowrap;}
  /* vista maestro: striscia dei giorni e sessioni compatte */
  .mt-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-dim);margin-bottom:4px;}
  .mt-sum b{color:var(--chalk);font-weight:600;}
  .mt-today{background:var(--board);border:1px solid var(--line);color:var(--ball);padding:7px 14px;font-size:12px;border-radius:20px;flex-shrink:0;}
  .mt-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px;}
  .mt-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:10px;background:var(--board);border:1px solid var(--line);color:var(--ink-dim);}
  .mt-day .dw{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
  .mt-day .dn{font-family:var(--font-display);font-size:20px;line-height:1.15;color:var(--chalk);}
  .mt-day .cnt{font-family:var(--font-mono);font-size:10px;min-height:13px;color:var(--ball);}
  .mt-day.empty{opacity:.5;}
  .mt-day.today:not(.sel){border-color:var(--ball-dim);}
  .mt-day.sel{background:var(--ball);border-color:var(--ball);opacity:1;}
  .mt-day.sel .dw,.mt-day.sel .dn,.mt-day.sel .cnt{color:#122019;}
  .mt-dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .mt-daytitle{font-family:var(--font-display);font-size:20px;letter-spacing:.02em;color:var(--chalk);}
  .mt-empty{text-align:center;color:var(--ink-dim);font-size:13px;padding:18px 0 8px;}
  .mt-item{border:1px solid var(--line);border-radius:10px;background:var(--board-2);margin-bottom:8px;overflow:hidden;}
  .mt-item.open{border-color:var(--ball-dim);}
  .mt-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;}
  .mt-item.static .mt-head{cursor:default;}
  .mt-time{font-family:var(--font-display);font-size:21px;letter-spacing:.02em;color:var(--chalk);flex:0 0 auto;}
  .mt-meta{flex:1;min-width:0;}
  .mt-name{font-weight:600;font-size:14px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mt-sub{font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .mt-chev{color:var(--ink-dim);font-size:18px;line-height:1;flex:0 0 auto;transition:transform .15s;}
  .mt-item.open .mt-chev{transform:rotate(90deg);}
  .mt-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;}
  .mt-chip{font-family:var(--font-mono);font-size:11px;border-radius:20px;padding:3px 9px;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap;}
  .mt-chip.ok{color:var(--ball);border-color:var(--ball-dim);}
  .mt-chip.no{color:var(--danger);border-color:var(--danger);}
  .mt-chip.hole{color:var(--chalk);background:var(--clay);border-color:var(--clay);}
  .mt-detail{border-top:1px solid var(--line);padding:10px 12px 12px;}
  .slot .mode-tag{display:block;font-size:8.5px;margin-top:1px;letter-spacing:.04em;text-transform:uppercase;opacity:.75;}
  .today-tally{display:flex;justify-content:space-between;align-items:center;background:var(--board);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .today-tally .num{font-family:var(--font-mono);font-size:22px;color:var(--ball);}
  .today-tally .lbl{font-size:12px;color:var(--ink-dim);}
  .who-bar{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0;gap:10px;}
  .who-bar .me{font-size:13px;color:var(--ink-dim);display:flex;align-items:center;gap:8px;}
  .who-bar .me b{color:var(--chalk);font-weight:600;}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--board);border:1px solid var(--line);flex-shrink:0;}
  .avatar-initials{width:34px;height:34px;border-radius:50%;background:var(--ball-dim);color:#16220F;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;flex-shrink:0;}
  .avatar-lg{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--board);border:1px solid var(--line);}
  .avatar-lg-initials{width:88px;height:88px;border-radius:50%;background:var(--ball-dim);color:#16220F;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:10px 6px;background:transparent;color:var(--ink-dim);border:none;border-right:1px solid var(--line);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--ball);color:#16220F;}
  .picker-list{display:none;margin-top:6px;background:var(--board);border:1px solid var(--line);border-radius:8px;max-height:230px;overflow-y:auto;}
  .picker.open .picker-list{display:block;}
  .picker-opt{padding:11px 12px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;}
  .picker-opt:last-child{border-bottom:none;}
  .picker-opt.sel{color:var(--ball);}
  .picker-opt.muted{color:var(--ink-dim);}
  .picker-empty{padding:11px 12px;font-size:13px;color:var(--ink-dim);}
  .pay-row{border-bottom:1px solid var(--line);padding:10px 0;}
  .pay-row:last-child{border-bottom:none;}
  .pay-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
  .pay-name{font-size:15px;color:var(--chalk);}
  .pay-detail{margin-top:8px;padding:10px;background:var(--board);border:1px solid var(--line);border-radius:8px;}
  .pay-month{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap;}
  .pay-opts{display:flex;gap:6px;}
  .small-btn.on-due{border-color:var(--danger);color:var(--danger);}
  .small-btn.on-paid{background:var(--ball);border-color:var(--ball);color:#16220F;}
  .small-btn.on-exempt{border-color:var(--ball);color:var(--ball);}
  .reco-panel{margin:8px 0 12px;padding:12px;border:1px solid var(--ball-dim);border-radius:10px;background:var(--board);}
  .reco-scroll{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px;}
  .reco-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .reco-row:last-child{border-bottom:none;}
  .reco-row.skipped{opacity:.55;}
  .reco-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .course-actions{display:grid;gap:8px;margin-top:10px;}
  .course-actions button{width:100%;min-width:0;padding:10px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-att{margin:2px 0 8px;font-size:13px;color:var(--ink-dim);display:flex;flex-direction:column;gap:5px;}
  .cal-att .pill{margin-right:6px;}
  .pay-opts.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;}
  .pay-opts.g4 .small-btn{width:100%;padding:8px 2px;overflow:hidden;text-overflow:ellipsis;}
  .pay-month .pay-opts.g4{flex:1 1 100%;}
  .pw-wrap{position:relative;width:100%;}
  .pw-wrap input{padding-right:84px;}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ball);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px;cursor:pointer;}
  .link{color:var(--ball);background:none;border:none;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 0;text-decoration:underline;cursor:pointer;}
  .member-row,.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .member-row:last-child,.list-row:last-child{border-bottom:none;}
  .member-row .name{font-weight:600;font-size:14.5px;}
  .pill{font-family:var(--font-mono);font-size:12px;background:var(--board);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ball);white-space:nowrap;}
  .pill.adminpill{color:var(--clay);border-color:var(--clay-dim);}
  .small-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:6px 9px;font-size:11px;border-radius:6px;white-space:nowrap;}
  .section-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);margin-bottom:4px;}
  .mode-choice{display:flex;gap:8px;}
  .mode-choice button{flex:1;background:var(--board);border:1px solid var(--line);color:var(--ink-dim);padding:10px 4px;font-size:12px;}
  .mode-choice button.sel{border-color:var(--ball);color:var(--ball);background:rgba(215,232,92,.08);}
  .period-strip{display:flex;gap:8px;}
  .period-strip button{flex:1;background:var(--board);border:1px solid var(--line);color:var(--ink-dim);padding:9px 4px;font-size:11.5px;}
  .period-strip button.sel{border-color:var(--ball);color:var(--ball);background:rgba(215,232,92,.08);}
  .totale-box{background:var(--board);border:1px solid var(--ball-dim);border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;}
  .totale-box .l{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-mono);}
  .totale-box .v{font-family:var(--font-display);font-size:22px;color:var(--ball);}
  .loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--ink-dim);font-family:var(--font-mono);font-size:13px;text-align:center;padding:0 30px;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--board-3);border:1px solid var(--ball-dim);color:var(--chalk);padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;animation:fadeUp .25s ease;max-width:85%;text-align:center;}
  @keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .modal-overlay{position:fixed;inset:0;background:rgba(8,13,10,.78);display:flex;align-items:flex-end;justify-content:center;z-index:99999;}
  .modal{background:var(--board-2);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 40px rgba(0,0,0,.5);}
  .modal h4{margin:0;font-family:var(--font-display);text-transform:uppercase;font-size:17px;}
  .copy-code{font-family:var(--font-mono);font-size:26px;letter-spacing:.12em;text-align:center;background:var(--board);border:1px dashed var(--clay);border-radius:8px;padding:14px;color:var(--ball);}
  .btn-row{display:flex;gap:10px;}
  .btn-row button{flex:1;}

  /* ================= Adattamento tablet / desktop ================= */
  @media (min-width: 640px){
    body{ background-image:
        radial-gradient(circle at 15% 0%, rgba(215,232,92,0.05), transparent 45%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
        var(--board);
    }
    #app{ max-width:640px; min-height:100vh; box-shadow:0 0 60px rgba(0,0,0,.4); border-left:1px solid var(--line); border-right:1px solid var(--line); }
    .modal-overlay{ align-items:center; padding:20px; }
    .modal{ border-radius:16px; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  }
  @media (min-width: 900px){
    #app{ max-width:880px; }
    .screen{ display:grid; grid-template-columns:1fr 1fr; align-items:start; gap:16px; }
    .screen > .card, .screen > #courseCards, .screen > #myAccountHost, .screen > #courtsHost, .screen > #loyaltyHost,
    .screen > #daysHost, .screen > .today-tally, .screen > .day-strip{ grid-column: 1 / -1; }

function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return dateKey(d);
}
function addDays(dateStr, n){

function yearMonth(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

const IT_MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function fmtMonth(ym){ const [y,m] = ym.split('-'); return IT_MONTHS[parseInt(m,10)-1]+' '+y; }
function normalizePhone(phone){
  let d = (phone||'').replace(/[^\d]/g,'');
  if(d.startsWith('0039')) d = d.slice(2);
  else if(d.length===10 && d.startsWith('3')) d = '39'+d;

function monthsBetween(startDateStr, endDateStr){
  const out = [];
  const capEnd = yearMonth(new Date()) < endDateStr.slice(0,7) ? yearMonth(new Date()) : endDateStr.slice(0,7);
  let [y,m] = startDateStr.slice(0,7).split('-').map(Number);
  const [ey,em] = capEnd.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){m=1;y++;}
  }
  return out;
}

function compressImageFile(file, maxDim=220, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Immagine non valida'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('Lettura file fallita'));
    reader.readAsDataURL(file);
  });
}

  const reasonWrap = overlay.querySelector('#reasonWrap');
  const reasonSelect = overlay.querySelector('#reasonSelect');
  const reasonCustomWrap = overlay.querySelector('#reasonCustomWrap');
  const debtWrap = overlay.querySelector('#debtWrap');
  const debtInput = overlay.querySelector('#debtInput');
  function syncReasonVisibility(){
    const newRate = parseFloat(rateInput.value);
    const isReduction = !isNaN(newRate) && newRate < currentRate;
    reasonWrap.style.display = isReduction ? 'flex' : 'none';
    reasonCustomWrap.style.display = (isReduction && reasonSelect.value==='__altro__') ? 'flex' : 'none';
    if(debtWrap){
      debtWrap.style.display = isReduction ? 'flex' : 'none';
      if(isReduction && debtInput.dataset.touched!=='1') debtInput.value = (currentRate - newRate).toFixed(2);
    }
  }
  rateInput.oninput = syncReasonVisibility;
  reasonSelect.onchange = syncReasonVisibility;
  if(debtInput) debtInput.oninput = () => { debtInput.dataset.touched = '1'; };
  syncReasonVisibility();

  overlay.querySelector('#cancelEditPrice').onclick = () => overlay.remove();
  overlay.querySelector('#confirmEditPrice').onclick = async () => {
    const newRate = parseFloat(rateInput.value);
    if(isNaN(newRate) || newRate<0){ toast('Importo non valido'); return; }
    let reason = null;
    const isReduction = newRate < currentRate;
    if(isReduction){
      reason = reasonSelect.value === '__altro__' ? overlay.querySelector('#reasonCustomInput').value.trim() : reasonSelect.value;
      if(!reason){ toast('Indica un motivo per la riduzione'); return; }
    }
    const debtAmount = (isReduction && debtInput) ? (parseFloat(debtInput.value) || 0) : 0;
    try{
      await update(ref(db, cpath('bookingsPrivate/'+bid)), { rate: newRate });
      if(isReduction && reasonSelect.value==='__altro__' && !reasons.includes(reason)){
        await update(ref(db, cpath('info')), { priceReductionReasons: [...reasons, reason] });
      }
      if(debtAmount > 0 && memberUid){
        const curSnap = await get(ref(db, cpath('memberDebts/'+memberUid+'/total')));

        type:'modifica_quota', forMemberName: memberName, courtId, courtName,

      overlay.remove();
    }catch(e){ toast('Errore: '+e.message); }
  };

          <div id="inviteErr"></div>

/* ================= Helper: testo, picker con ricerca, pagamenti corsi ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normTxt(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function fmtEuro(n){ n = Math.round((Number(n)||0)*100)/100; return Number.isInteger(n) ? String(n) : n.toFixed(2); }

/* Menu a tendina con ricerca: lo stato (valore, testo cercato, aperto/chiuso) vive in state.pickers,
   quindi sopravvive ai re-render causati dagli aggiornamenti di Firebase. */
function makePicker(key, items, opts){
  opts = opts || {};
  if(!state.pickers[key]) state.pickers[key] = { value: opts.initial || '', q:'', open:false };
  const st = state.pickers[key];
  const wrap = document.createElement('div');
  wrap.className = 'picker' + (st.open ? ' open' : '');
  wrap.dataset.key = key;
  wrap.innerHTML = '<input class="picker-input" id="picker-'+key+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="picker-list"></div>';
  const input = wrap.querySelector('input');
  const list = wrap.querySelector('.picker-list');
  const noneText = opts.noneLabel || '';
  const labelOf = v => { const it = items.find(i=>i.value===v); return it ? it.label : ''; };
  function syncInput(){
    if(st.open){
      input.value = st.q;
      input.placeholder = st.value ? labelOf(st.value) : (opts.placeholder || 'Cerca…');
    } else {
      input.value = st.value ? labelOf(st.value) : '';
      input.placeholder = noneText || opts.placeholder || 'Cerca…';
    }
  }
  function choose(v){
    st.value = v; st.open = false; st.q = '';
    wrap.classList.remove('open'); syncInput(); input.blur();
    if(opts.onChange) opts.onChange(v);
  }
  function paintList(){
    const n = normTxt(st.q.trim());
    const matches = items.filter(i => !n || normTxt(i.label).includes(n));
    list.innerHTML = '';
    if(noneText && !n){
      const o = document.createElement('div');
      o.className = 'picker-opt muted' + (!st.value ? ' sel' : '');
      o.textContent = noneText; o.onclick = () => choose('');
      list.appendChild(o);
    }
    if(!matches.length){
      const e = document.createElement('div'); e.className = 'picker-empty'; e.textContent = 'Nessun risultato';
      list.appendChild(e); return;
    }
    matches.slice(0,50).forEach(it=>{
      const o = document.createElement('div');
      o.className = 'picker-opt' + (it.value===st.value ? ' sel' : '');
      o.textContent = it.label; o.onclick = () => choose(it.value);
      list.appendChild(o);
    });
    if(matches.length > 50){
      const m = document.createElement('div'); m.className = 'picker-empty';
      m.textContent = 'Altri '+(matches.length-50)+' risultati: continua a scrivere per restringere';
      list.appendChild(m);
    }
  }
  wrap._close = () => { st.open = false; st.q = ''; wrap.classList.remove('open'); syncInput(); };
  input.addEventListener('focus', ()=>{ if(!st.open){ st.open = true; st.q = ''; } wrap.classList.add('open'); syncInput(); paintList(); });
  input.addEventListener('input', ()=>{ st.q = input.value; st.open = true; wrap.classList.add('open'); paintList(); });
  syncInput();
  if(st.open) paintList();
  return wrap;
}
document.addEventListener('click', (e)=>{
  document.querySelectorAll('.picker.open').forEach(w=>{ if(!w.contains(e.target) && w._close) w._close(); });
});

/* Pagamenti corsi: true = pagato, 'esente' = mese non dovuto (solo admin), altro = da pagare.
   I mesi dovuti di default sono tutti quelli dall'inizio del corso al mese corrente. */
const PAY_EXEMPT = 'esente';
function payStatus(payMap, m){ const v = payMap ? payMap[m] : undefined; return v===true ? 'paid' : (v===PAY_EXEMPT ? 'exempt' : 'due'); }
const METHOD_LABEL = { cash:'Contanti', card:'Carta' };
function payMethodOf(payMap, m){ const mt = payMap && payMap._meta && payMap._meta[m]; return (mt && (mt.m==='cash' || mt.m==='card')) ? mt.m : ''; }
function payKey(payMap, m){ const st = payStatus(payMap, m); return st!=='paid' ? st : (payMethodOf(payMap, m) || 'paid'); }
function blockKey(payMap, blk){ const set = new Set(blk.map(m=>payKey(payMap, m))); return set.size===1 ? [...set][0] : 'mixed'; }
function payDateOf(payMap, m){ const mt = payMap && payMap._meta && payMap._meta[m]; return mt && mt.t ? new Date(mt.t).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) : ''; }
function addMonthsYM(ym, n){ let [y,m] = ym.split('-').map(Number); m += n; while(m>12){ m-=12; y++; } return y+'-'+String(m).padStart(2,'0'); }
/* Blocchi di pagamento: bimestrale (default) = 2 mesi insieme, dovuti dal primo mese del blocco;
   mensile = un mese per volta. Ultimo blocco del corso: può avere un solo mese. */
function billingBlocks(course, billing){
  if(!course.startDate || !course.endDate) return [];
  const endYM = course.endDate.slice(0,7), nowYM = currentYearMonth();
  const out = [];
  let ym = course.startDate.slice(0,7);
  const step = billing==='monthly' ? 1 : 2;
  while(ym <= endYM && ym <= nowYM){
    const blk = [ym];
    if(step===2){ const nx = addMonthsYM(ym,1); if(nx <= endYM) blk.push(nx); }
    out.push(blk);
    ym = addMonthsYM(ym, step);
  }
  return out;
}
function fmtBlock(ms){ return ms.length===1 ? fmtMonth(ms[0]) : fmtMonth(ms[0])+' – '+fmtMonth(ms[ms.length-1]); }
function blockStatus(payMap, blk){
  const set = new Set(blk.map(m=>payStatus(payMap, m)));
  return set.size===1 ? [...set][0] : 'mixed';
}
function courseDueSummary(course, payMap, billing){
  const fee = Number(course.monthlyFee)||0;
  const blocks = billingBlocks(course, billing);
  const months = blocks.flat();
  const s = { blocks, months, due:0, paid:0, exempt:0, dueMonths:[], methods:new Set(), fee, billing: billing==='monthly' ? 'monthly' : 'bimonthly' };
  months.forEach(m=>{
    const st = payStatus(payMap, m);
    if(st==='paid'){ s.paid++; s.methods.add(payMethodOf(payMap, m) || '?'); } else if(st==='exempt') s.exempt++; else { s.due++; s.dueMonths.push(m); }
  });
  s.dueAmount = s.due*fee; s.paidAmount = s.paid*fee;
  return s;
}
function payPill(s){
  if(s.due>0) return { label:'Da pagare € '+fmtEuro(s.dueAmount), style:'color:var(--danger);border-color:var(--danger);' };
  if(!s.months.length) return { label:'Non ancora dovuto', style:'color:var(--ink-dim);' };
  if(s.paid===0) return { label:'Esente', style:'' };
  let label = 'Pagato';
  if(s.methods && s.methods.size===1){ const k = [...s.methods][0]; if(METHOD_LABEL[k]) label += ' · '+METHOD_LABEL[k]; }
  return { label, style:'' };
}
async function setPaymentBlock(cid, eid, months, status, method){
  const c = state.courses[cid] || {};
  const fee = Number(c.monthlyFee) || 0;
  const now = Date.now();
  const prevMeta = (((state.coursePayments[cid]||{})[eid]) || {})._meta || {};
  const obj = {};
  months.forEach(m=>{
    if(status==='paid'){
      obj[m] = true;
      const keepT = prevMeta[m] && prevMeta[m].t ? prevMeta[m].t : now;   // cambiare metodo non sposta la data dell'incasso
      obj['_meta/'+m] = { m: method==='card' ? 'card' : 'cash', t: keepT, a: (prevMeta[m] && prevMeta[m].a!=null) ? prevMeta[m].a : fee };
    } else {
      obj[m] = status==='exempt' ? PAY_EXEMPT : false;
      obj['_meta/'+m] = null;
    }
  });
  try{ await update(ref(db, cpath('coursePayments/'+cid+'/'+eid)), obj); }
  catch(err){ toast('Errore: '+err.message); }
}
async function setBilling(cid, eid, mode){
  try{ await update(ref(db, cpath('courseEnrollments/'+cid+'/'+eid)), { billing: mode==='monthly' ? 'monthly' : null }); }
  catch(err){ toast('Errore: '+err.message); }
}

function buildPayDetail(r, repaint){
  const s = r.s;
  const monthly = r.e.billing === 'monthly';
  const det = document.createElement('div');
  det.className = 'pay-detail';
  const info = document.createElement('div');
  info.className = 'hint'; info.style.marginBottom = '6px';
  info.textContent = 'Quota € '+fmtEuro(s.fee)+'/mese'+(monthly ? '' : ' · € '+fmtEuro(s.fee*2)+' ogni 2 mesi')+(r.e.phone ? ' · '+r.e.phone : '');
  det.appendChild(info);
  const lab = document.createElement('div');
  lab.className = 'hint'; lab.textContent = 'Modalità di pagamento';
  det.appendChild(lab);
  const seg = document.createElement('div');
  seg.className = 'seg'; seg.style.margin = '4px 0 10px';
  [['bimonthly','Bimestrale'],['monthly','Mensile']].forEach(([k,txt])=>{
    const isOn = (k==='monthly') === monthly;
    const b = document.createElement('button');
    b.textContent = txt; b.className = isOn ? 'active' : '';
    b.onclick = () => { if(!isOn) setBilling(r.cid, r.eid, k); };
    seg.appendChild(b);
  });
  det.appendChild(seg);
  if(!s.blocks.length){
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Nessun pagamento ancora dovuto.';
    det.appendChild(h);
  }
  const optsFor = (months, cur) => {
    const wrap = document.createElement('div'); wrap.className = 'pay-opts g4';
    [['due','Da pagare'],['cash','Contanti'],['card','Carta'],['exempt','Esente']].forEach(([k,txt])=>{
      const b = document.createElement('button');
      b.className = 'small-btn' + (cur===k ? (k==='due' ? ' on-due' : (k==='exempt' ? ' on-exempt' : ' on-paid')) : '');
      b.textContent = txt;
      b.onclick = () => {
        if(cur===k) return;
        if(k==='cash' || k==='card') setPaymentBlock(r.cid, r.eid, months, 'paid', k);
        else setPaymentBlock(r.cid, r.eid, months, k);
      };
      wrap.appendChild(b);
    });
    return wrap;
  };
  s.blocks.forEach(blk=>{
    const st = blockKey(r.payMap, blk);
    const splitKey = r.key+'|'+blk[0];
    const split = blk.length>1 && (st==='mixed' || state.paySplit[splitKey]);
    if(!split){
      const line = document.createElement('div'); line.className = 'pay-month';
      const l = document.createElement('span');
      l.textContent = fmtBlock(blk)+' · € '+fmtEuro(blk.length*s.fee)+(st==='paid' ? ' · metodo non indicato' : '')+((st==='cash'||st==='card') ? ' · '+payDateOf(r.payMap, blk[0]) : '');
      line.appendChild(l);
      line.appendChild(optsFor(blk, st));
      det.appendChild(line);
      if(blk.length>1){
        const lk = document.createElement('button');
        lk.className = 'link'; lk.style.cssText = 'font-size:12px;padding:0 0 6px;';
        lk.textContent = 'Gestisci per mese (eccezioni)';
        lk.onclick = () => { state.paySplit[splitKey] = true; repaint(); };
        det.appendChild(lk);
      }
    } else {
      const head = document.createElement('div'); head.className = 'hint'; head.style.marginTop = '4px';
      head.textContent = fmtBlock(blk);
      det.appendChild(head);
      blk.forEach(m=>{
        const line = document.createElement('div'); line.className = 'pay-month';
        const km = payKey(r.payMap, m);
        const l = document.createElement('span'); l.textContent = fmtMonth(m)+' · € '+fmtEuro(s.fee)+(km==='paid' ? ' · metodo non indicato' : '')+((km==='cash'||km==='card') ? ' · '+payDateOf(r.payMap, m) : '');
        line.appendChild(l);
        line.appendChild(optsFor([m], km));
        det.appendChild(line);
      });
      if(st!=='mixed'){
        const lk = document.createElement('button');
        lk.className = 'link'; lk.style.cssText = 'font-size:12px;padding:0 0 6px;';
        lk.textContent = 'Torna al blocco unico';
        lk.onclick = () => { delete state.paySplit[splitKey]; repaint(); };
        det.appendChild(lk);
      }
    }
  });
  if(s.due>0){
    const acts = document.createElement('div');
    acts.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;';
    [['cash','Tutto pagato · Contanti'],['card','Tutto pagato · Carta']].forEach(([k,txt])=>{
      const bt = document.createElement('button');
      bt.className = 'btn-ghost'; bt.style.cssText = 'flex:1 1 45%;padding:9px 6px;font-size:12px;';
      bt.textContent = txt;
      bt.onclick = () => setPaymentBlock(r.cid, r.eid, s.dueMonths, 'paid', k);
      acts.appendChild(bt);
    });
    if(r.e.phone){
      const wa = document.createElement('button');
      wa.className = 'btn-ghost'; wa.style.cssText = 'flex:1 1 100%;padding:9px 10px;font-size:12px;';
      wa.textContent = 'Sollecita su WhatsApp';
      const dueLabel = s.blocks
        .map(b=>b.filter(m=>payStatus(r.payMap,m)==='due'))
        .filter(b=>b.length)
        .map(fmtBlock).join(', ');
      wa.onclick = () => window.open(buildWhatsAppReminderUrl(r.e.phone, r.name, r.c.name, dueLabel, fmtEuro(s.dueAmount)), '_blank');
      acts.appendChild(wa);
    }
    det.appendChild(acts);
  }
  return det;
}

/* ================= Incassi mensili (solo admin): contanti / carta / totale ================= */
function ymOfTs(t){ const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function collectPayments(){
  const groups = {}; let legacy = 0;
  Object.entries(state.coursePayments||{}).forEach(([cid, byEid])=>{
    const c = state.courses[cid]; if(!c) return;
    Object.entries(byEid||{}).forEach(([eid, payMap])=>{
      if(!payMap || typeof payMap !== 'object') return;
      const meta = payMap._meta || {};
      Object.keys(payMap).forEach(m=>{
        if(m==='_meta' || payMap[m]!==true) return;
        const mt = meta[m];
        if(!mt || !mt.t || (mt.m!=='cash' && mt.m!=='card')){ legacy++; return; }
        const key = cid+'|'+eid+'|'+mt.t+'|'+mt.m;
        const g = groups[key] || (groups[key] = { cid, eid, t:mt.t, method:mt.m, amount:0, months:[], ym: ymOfTs(mt.t) });
        g.amount += Number(mt.a!=null ? mt.a : c.monthlyFee) || 0;
        g.months.push(m);
      });
    });
  });
  const list = Object.values(groups);
  list.forEach(g=>{
    g.months.sort();
    const e = ((state.courseEnrollments[g.cid]||{})[g.eid]) || {};
    g.name = e.name || '—';
    g.courseName = (state.courses[g.cid]||{}).name || '';
  });
  return { list, legacy };
}

  const cur = currentYearMonth();
  let note = ym===cur ? 'Mese in corso: totale provvisorio, si aggiorna a ogni pagamento registrato.' : (ym<cur ? 'Mese chiuso.' : 'Mese futuro.');
  if(legacy>0) note += ' ' + legacy + (legacy===1?' mese risulta pagato':' mesi risultano pagati') + ' senza metodo (registrati prima): aprili in Pagamenti e scegli Contanti o Carta.';
  if(loadedCount < courses.length) note += ' Carico i dati… ('+loadedCount+'/'+courses.length+' corsi)';
  screen.querySelector('#incNote').textContent = note;

  // per corso

  const cHost = screen.querySelector('#incCourses');

    const row = document.createElement('div'); row.className = 'list-row'; row.style.flexWrap = 'wrap'; row.style.gap = '4px 8px';

    cHost.appendChild(row);

  const lHost = screen.querySelector('#incList');

  inMonth.forEach(g=>{

function renderPaymentsScreen(host){

  courses.forEach(([cid])=>{ loadCourseEnrollments(cid); loadCoursePaymentsForCourse(cid); });
  if(state.payCourse && !state.courses[state.payCourse]) state.payCourse = '';
  const loadedCount = courses.filter(([cid])=> state.courseEnrollments[cid]!==undefined && state.payLoaded[cid]).length;

        <div class="field" style="flex:1;min-width:0;"><label>Ordina</label>

      </div>
    </div>
    <div class="card" id="payList"></div>`;
  host.replaceChildren(screen);
  bindCorsiSwitch(screen);

  const head = screen.querySelector('#payHead');
  const chips = screen.querySelector('#payChips');
  const listHost = screen.querySelector('#payList');

  function makeRow(r, repaint){
    const s = r.s;
    const pill = payPill(s);
    const el = document.createElement('div');
    el.className = 'pay-row';
    el.innerHTML = `<div class="pay-head"><div style="min-width:0;"><div class="pay-name">${esc(r.name)}</div><div class="hint">${esc(r.c.name)}${r.e.billing==='monthly'?' · mensile':' · bimestrale'}${s.due>0?' · '+s.due+(s.due===1?' mese':' mesi'):''}</div></div><span class="pill" style="${pill.style}">${pill.label}</span></div>`;
    el.querySelector('.pay-head').onclick = () => {
      if(state.payExpanded[r.key]) delete state.payExpanded[r.key]; else state.payExpanded[r.key] = true;
      repaint();
    };
    if(state.payExpanded[r.key]) el.appendChild(buildPayDetail(r, repaint));
    return el;
  }

  function paint(){
    const all = [];
    courses.forEach(([cid,c])=>{
      if(state.payCourse && state.payCourse!==cid) return;
      const enr = state.courseEnrollments[cid] || {};
      const pays = state.coursePayments[cid] || {};
      Object.entries(enr).forEach(([eid,e])=>{
        const payMap = pays[eid] || {};
        all.push({ key:cid+'|'+eid, cid, eid, c, e, payMap, s:courseDueSummary(c, payMap, e.billing), name:e.name||'—' });
      });
    });
    const totDue = all.reduce((a,r)=>a+r.s.dueAmount, 0);
    const totPaid = all.reduce((a,r)=>a+r.s.paidAmount, 0);
    const peopleDue = all.filter(r=>r.s.due>0).length;
    head.innerHTML = `<div class="card">
      <div class="list-row"><span>Da incassare</span><span class="pill" style="${totDue>0?'color:var(--danger);border-color:var(--danger);':''}">€ ${fmtEuro(totDue)}</span></div>
      <div class="list-row"><span>Corsisti con quote da pagare</span><span class="pill">${peopleDue} su ${all.length}</span></div>
      <div class="list-row"><span>Già incassato</span><span class="pill">€ ${fmtEuro(totPaid)}</span></div>
      ${loadedCount<courses.length?`<div class="hint" style="margin-top:6px;">Carico i dati… (${loadedCount}/${courses.length} corsi)</div>`:''}
    </div>`;

    const q = normTxt(state.payQuery.trim());
    const byQuery = q ? all.filter(r=>normTxt(r.name).includes(q)) : all;
    const nDue = byQuery.filter(r=>r.s.due>0).length;
    const nPaid = byQuery.length - nDue;
    chips.innerHTML = '';
    [['due','Da pagare ('+nDue+')'],['paid','Pagati ('+nPaid+')'],['all','Tutti ('+byQuery.length+')']].forEach(([k,lab])=>{
      const b = document.createElement('button');
      b.className = state.payFilter===k ? 'active' : '';
      b.textContent = lab;
      b.onclick = () => { state.payFilter = k; state.payLimit = 30; paint(); };
      chips.appendChild(b);
    });

    // le righe aperte restano visibili anche se, dopo una modifica, non rientrano più nel filtro
    let rows = byQuery.filter(r => state.payFilter==='all' || (state.payFilter==='due' ? r.s.due>0 : r.s.due===0) || state.payExpanded[r.key]);
    rows.sort((a,b)=> state.paySort==='due'
      ? (b.s.dueAmount-a.s.dueAmount) || a.name.localeCompare(b.name,'it')
      : a.name.localeCompare(b.name,'it') || String(a.c.name).localeCompare(String(b.c.name),'it'));

    listHost.innerHTML = '';
    if(!courses.length){ listHost.innerHTML = `<div class="hint">Nessun corso ancora creato.</div>`; return; }
    if(!rows.length){ listHost.innerHTML = `<div class="hint">${byQuery.length?'Nessun corsista in questo elenco.':'Nessun corsista trovato.'}</div>`; return; }
    rows.slice(0, state.payLimit).forEach(r=> listHost.appendChild(makeRow(r, paint)));
    if(rows.length > state.payLimit){
      const more = document.createElement('button');
      more.className = 'btn-ghost'; more.style.cssText = 'width:100%;margin-top:10px;';
      more.textContent = 'Mostra altri ('+(rows.length-state.payLimit)+')';
      more.onclick = () => { state.payLimit += 30; paint(); };
      listHost.appendChild(more);
    }
  }

  screen.querySelector('#paySearch').oninput = (e)=>{ state.payQuery = e.target.value; state.payLimit = 30; paint(); };
  screen.querySelector('#payCourse').onchange = (e)=>{ state.payCourse = e.target.value; state.payLimit = 30; paint(); };
  screen.querySelector('#paySort').onchange = (e)=>{ state.paySort = e.target.value; paint(); };
  paint();
}

/* ================= Presenze con orario limite + recuperi lezioni ================= */
const ATTENDANCE_CUTOFF_DEFAULT_HOUR = 13; // default: i corsisti possono inviare/cambiare la presenza fino alle 13:00 del giorno della lezione
function getAttendanceCutoffHour(){ // configurabile dall'admin (info/attendanceCutoffHour)
  const raw = state.club ? state.club.attendanceCutoffHour : null;
  const h = Number(raw);
  return (raw!=null && Number.isInteger(h) && h>=0 && h<=23) ? h : ATTENDANCE_CUTOFF_DEFAULT_HOUR;
}
function nowDate(){ return state.debugNow ? new Date(state.debugNow) : new Date(); }
function nextLesson(course, e){
  const now = nowDate();
  const sessions = getCourseSessions(course).filter(x=>enrolleeAttendsSession(e, x.weekday, x.hour, x.courtId));
  for(let i=0;i<15;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    const key = dateKey(d);
    if(key < course.startDate || key > course.endDate) continue;
    const todays = sessions.filter(s=>s.weekday===d.getDay()).sort((a,b)=>a.hour-b.hour);
    for(const s of todays){
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), s.hour+1);
      if(end > now) return { date:key, hour:s.hour, courtId:s.courtId };
    }
  }
  return null;
}
function attendanceCutoff(date, hour){
  const [y,m,d] = date.split('-').map(Number);
  return new Date(y, m-1, d, Math.min(getAttendanceCutoffHour(), hour), 0, 0);
}

/* Presenza per ORA. Formato nel database, per corsista e giorno:
   - vecchio: true/false  -> vale per tutte le ore di quel giorno
   - nuovo:   { h10: false, h11: true } -> una voce per ogni ora (ora mancante = presente) */
function attGet(raw, hour){
  if(raw===true || raw===false) return raw;
  if(raw && typeof raw==='object'){ const v = raw['h'+hour]; return (v===true || v===false) ? v : undefined; }
  return undefined;
}
/* Ore assegnate per iscritto: courseEnrollments/{cid}/{eid}/sessions = { "1_17": true, "3_18": true } (chiave = giorno_ora).
   Se manca, l'iscritto frequenta tutte le sessioni del corso. */
function sessionKey(weekday, hour, courtId){ // giorno_ora_campo (il formato vecchio giorno_ora vale per qualsiasi campo)
  return courtId!=null && courtId!=='' ? weekday+'_'+hour+'_'+String(courtId).replace(/[.$#\[\]\/]/g,'-') : weekday+'_'+hour;
}
function enrolleeSessionSet(e){ const m = e && e.sessions; return (m && typeof m==='object' && Object.keys(m).length) ? m : null; }
function enrolleeAttendsSession(e, weekday, hour, courtId){ // courtId omesso = in qualsiasi campo a quell'ora
  const m = enrolleeSessionSet(e); if(!m) return true;
  if(m[weekday+'_'+hour]) return true; // formato vecchio, senza campo
  if(courtId!=null && courtId!=='') return !!m[sessionKey(weekday,hour,courtId)];
  const pre = weekday+'_'+hour+'_';
  return Object.keys(m).some(k=>k.startsWith(pre));
}
function enrolleeCourseHoursOn(course, e, date){ // ore del giorno in cui l'iscritto ha lezione (una sola volta per ora)
  if(!course || date < course.startDate || date > course.endDate) return [];
  const dow = new Date(date+'T00:00:00').getDay();
  const hs = getCourseSessions(course).filter(x=>x.weekday===dow && enrolleeAttendsSession(e, dow, x.hour, x.courtId)).map(x=>x.hour);
  return [...new Set(hs)].sort((a,b)=>a-b);
}
function courtNameOf(courtId){ return ((state.club && state.club.courts || []).find(x=>x.id===courtId)||{}).name || ''; }
function courseHasOverlap(course){ // due campi alla stessa ora nello stesso giorno
  const seen = new Set();
  return getCourseSessions(course).some(x=>{ const k=x.weekday+'_'+x.hour; if(seen.has(k)) return true; seen.add(k); return false; });
}
function enrolleeCourtName(course, e, weekday, hour){ // campo assegnato all'iscritto a quell'ora (solo se il corso ha due campi allo stesso orario)
  if(!enrolleeSessionSet(e)) return '';
  const opts = getCourseSessions(course).filter(x=>x.weekday===weekday && x.hour===hour);
  if(opts.length < 2) return '';
  const hit = opts.find(x=>enrolleeAttendsSession(e, weekday, hour, x.courtId));
  return hit ? courtNameOf(hit.courtId) : '';
}
function getEnrollment(cid, eid){
  const e = (state.courseEnrollments[cid]||{})[eid];
  if(e) return e;
  return (state.myEnrollments && state.myEnrollments[cid]===eid) ? state.myEnrollmentData[cid] : undefined;
}
function freeSeatsAt(c, weekday, hour, courtId){ // posti liberi in una certa sessione del corso
  const cap = Number(c.maxSeats)||0;
  const st = c.seatsTaken || {};
  const k = sessionKey(weekday, hour, courtId), k2 = sessionKey(weekday, hour);
  const taken = st[k]!=null ? Number(st[k]) : (st[k2]!=null ? Number(st[k2]) : (Number(c.enrolledCount)||0));
  return Math.max(0, cap - taken);
}
function seatsTakenMap(cid){
  const c = state.courses[cid] || {}, enr = Object.values(state.courseEnrollments[cid]||{});
  const out = {};
  getCourseSessions(c).forEach(x=>{ out[sessionKey(x.weekday,x.hour,x.courtId)] = enr.filter(e=>enrolleeAttendsSession(e,x.weekday,x.hour,x.courtId)).length; });
  return out;
}
function syncSeatsTaken(cid){ // solo admin: tiene aggiornato courses/{cid}/seatsTaken, leggibile dai corsisti
  if(!state.isAdmin) return;
  const c = state.courses[cid]; if(!c || state.courseEnrollments[cid]===undefined) return;
  const m = seatsTakenMap(cid), old = c.seatsTaken || {};
  const same = Object.keys(m).length===Object.keys(old).length && Object.keys(m).every(k=>Number(old[k])===m[k]);
  if(same) return;
  update(ref(db, cpath('courses/'+cid)), { seatsTaken: m }).catch(e=>console.warn('seatsTaken', e));
}
function uniqueSessions(course){
  const seen = new Set();
  return getCourseSessions(course).slice().sort((a,b)=>a.weekday-b.weekday||a.hour-b.hour)
    .filter(x=>{ const k=sessionKey(x.weekday,x.hour,x.courtId); if(seen.has(k)) return false; seen.add(k); return true; });
}
function sessionLabel(x, withCourt){ return WEEKDAY_FULL[x.weekday].slice(0,3)+' '+String(x.hour).padStart(2,'0')+':00'+(withCourt && courtNameOf(x.courtId) ? ' · '+courtNameOf(x.courtId) : ''); }
function multiCourt(course){ return new Set(getCourseSessions(course).map(x=>x.courtId)).size > 1; }
function sessionsSummary(course, e){ // es. "Lun 17:00 · Gio 18:00" oppure '' se frequenta tutte
  const m = enrolleeSessionSet(e); if(!m) return '';
  const mc = multiCourt(course);
  return uniqueSessions(course).filter(x=>enrolleeAttendsSession(e, x.weekday, x.hour, x.courtId)).map(x=>sessionLabel(x, mc)).join(' · ');
}
/* Caselle per scegliere le ore frequentate. onChange riceve: null (tutte), oggetto {chiave:true} oppure 'none' (nessuna spunta) */
function buildSessionPicker(course, current, onChange){
  const sess = uniqueSessions(course);
  const mc = multiCourt(course);
  const sameSlot = (x,y)=>x.weekday===y.weekday && x.hour===y.hour;
  const hasOverlap = sess.some((x,i)=>sess.some((y,j)=>i!==j && sameSlot(x,y)));
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;';
  wrap.innerHTML = `<div class="hint" style="margin-bottom:6px;">Ore frequentate: spunta quelle assegnate${hasOverlap?'. Dove ci sono due campi alla stessa ora, scegli quello del corsista.':''}</div>`;
  const cbs = [];
  const read = () => {
    const picked = sess.filter((x,i)=>cbs[i].checked);
    if(!picked.length) return 'none';
    if(picked.length===sess.length && !hasOverlap) return null;
    const m = {}; picked.forEach(x=>{ m[sessionKey(x.weekday,x.hour,x.courtId)] = true; });
    return m;
  };
  sess.forEach((x,i)=>{
    const lab = document.createElement('label');
    lab.style.cssText = 'display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.style.cssText='width:auto;margin:0;';
    cb.checked = current ? enrolleeAttendsSession({sessions:current}, x.weekday, x.hour, x.courtId) : true;
    cb.onchange = () => {
      if(cb.checked) sess.forEach((y,j)=>{ if(j!==i && sameSlot(x,y)) cbs[j].checked = false; }); // un solo campo per ora
      onChange(read());
    };
    cbs.push(cb);
    const t = document.createElement('span'); t.textContent = sessionLabel(x, mc);
    lab.appendChild(cb); lab.appendChild(t); wrap.appendChild(lab);
  });
  sess.forEach((x,i)=>{ // stato iniziale: se due campi sono spuntati alla stessa ora, resta solo il primo
    if(!cbs[i].checked) return;
    const firstIdx = sess.findIndex(y=>sameSlot(x,y));
    if(firstIdx!==i && cbs[firstIdx].checked) cbs[i].checked = false;
  });
  wrap.getValue = read;
  return wrap;
}
function sessionsFull(cid, keys, excludeEid){ // prima sessione già al completo tra quelle indicate (null = nessuna)
  const c = state.courses[cid] || {}, enr = state.courseEnrollments[cid]||{};
  const cap = Number(c.maxSeats)||0;
  for(const x of uniqueSessions(c)){
    if(keys && !enrolleeAttendsSession({sessions:keys}, x.weekday, x.hour, x.courtId)) continue;
    const taken = Object.entries(enr).filter(([eid,e])=>eid!==excludeEid && enrolleeAttendsSession(e,x.weekday,x.hour,x.courtId)).length;
    if(taken >= cap) return x;
  }
  return null;
}
function courseHoursOn(course, date){
  if(!course || date < course.startDate || date > course.endDate) return [];
  const dow = new Date(date+'T00:00:00').getDay();
  return getCourseSessions(course).filter(x=>x.weekday===dow).map(x=>x.hour).sort((a,b)=>a-b);
}
function attAbsentCount(course, date, raw, e){ // ore di assenza del corsista in quel giorno
  if(raw===false) return (e ? enrolleeCourseHoursOn(course, e, date) : courseHoursOn(course, date)).length || 1;
  if(raw && typeof raw==='object') return Object.values(raw).filter(v=>v===false).length;
  return 0;
}
async function writeAttendance(cid, date, eid, hour, val, courtId){
  const course = state.courses[cid] || {};
  const path = cpath('courseAttendance/'+cid+'/'+date+'/'+eid);
  const raw = (await get(ref(db, path))).val();
  if(raw===true || raw===false){ // dato vecchio (valeva per tutto il giorno): lo scompongo per ora
    const obj = {};
    courseHoursOn(course, date).forEach(h=>{ obj['h'+h] = raw; });
    obj['h'+hour] = val;
    if(courtId) obj['c'+hour] = courtId;
    await set(ref(db, path), obj);
  } else {
    const upd = {}; upd['h'+hour] = val; if(courtId) upd['c'+hour] = courtId;
    await update(ref(db, path), upd);
  }
}

function lessonsHeld(course, e){ // numero di ORE di lezione svolte finora (per l'iscritto e, se indicato)
  const today = todayKey();
  const end = course.endDate < today ? course.endDate : today;
  let n = 0, k = course.startDate, guard = 0;
  while(k && k <= end && guard++ < 800){ n += (e ? enrolleeCourseHoursOn(course, e, k) : courseHoursOn(course, k)).length; k = addDays(k, 1); }
  return n;
}
function countAbsences(course, hist, eid, e){ // ore di assenza fino a oggi
  let a = 0;
  Object.entries(hist||{}).forEach(([date, dm])=>{ if(dm && date<=todayKey()) a += attAbsentCount(course, date, dm[eid], e); });
  return a;
}
const myAttListeners = new Set();
function loadMyAttendance(cid, date, eid){
  const key = cid+'|'+date+'|'+eid;
  if(myAttListeners.has(key)) return;
  myAttListeners.add(key);
  onValue(ref(db, cpath('courseAttendance/'+cid+'/'+date+'/'+eid)), s=>{
    state.myAttendance[cid+'|'+date] = s.val();
    renderCurrent();
  }, err=>console.error('myAttendance', err));
}


/* Schermata di conferma (promise -> true/false), usata prima di registrare un'assenza */
function askConfirm({ title, text, okLabel, okClass }){
  return new Promise(resolve=>{
    document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal">
      <h4>${esc(title)}</h4>
      <div style="font-size:14px;line-height:1.5;color:var(--chalk);">${text}</div>
      <div class="btn-row">
        <button class="btn-ghost" id="cfNo">Annulla</button>
        <button class="${okClass||'btn-clay'}" id="cfYes">${esc(okLabel||'Conferma')}</button>
      </div>
    </div>`;
    const done = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e=>{ if(e.target===ov) done(false); });
    ov.querySelector('#cfNo').onclick = () => done(false);
    ov.querySelector('#cfYes').onclick = () => done(true);
    document.body.appendChild(ov);
  });
}
function lessonLabelHtml(courseName, date, hour){
  const dow = new Date(date+'T00:00:00').getDay();

}

/* Messaggio informativo con un solo pulsante */

}

/* Un corsista assente può tornare "presente" solo se il maestro non ha già inserito un sostituto
   che, tornando lui, resterebbe senza posto. I sostituti inseriti sono in courseSubstitutes/{cid}/{data}. */
async function substituteBlocksReturn(cid, date, hour, courtId){
  try{
    const c = state.courses[cid] || {};
    const [subSnap, attSnap] = await Promise.all([
      get(ref(db, cpath('courseSubstitutes/'+cid+'/'+date))),
      get(ref(db, cpath('courseAttendance/'+cid+'/'+date)))
    ]);
    // un sostituto vale per questa ora/campo se il segnalino non indica altro (i vecchi segnalini valgono per tutta la giornata)
    const subs = Object.values(subSnap.val()||{}).filter(m=>{
      if(m && typeof m==='object') return (m.h==null || m.h===hour) && (m.c==null || !courtId || m.c===courtId);
      return true;
    }).length;
    if(!subs) return false;
    const absent = Object.values(attSnap.val()||{}).filter(v=>{
      if(attGet(v,hour)!==false) return false;
      const tag = (v && typeof v==='object') ? v['c'+hour] : null; // campo registrato con l'assenza
      return !tag || !courtId || tag===courtId;
    }).length;
    const free = freeSeatsAt(c, new Date(date+'T00:00:00').getDay(), hour, courtId);
    return subs >= absent + free; // tornando, il numero di posti non basterebbe per tutti i sostituti
  }catch(e){ console.warn('substituteBlocksReturn', e); return false; }
}
async function warnSubstituteFound(cname, date, hour){
  await askInfo({
    title: 'Non puoi tornare presente',
    text: lessonLabelHtml(cname, date, hour)+'<br><br>Il maestro ha già trovato un sostituto per questa ora. Contatta il maestro per modificare la tua assenza.'
  });
}

/* ===== Calendario settimanale: il corsista gestisce le assenze di tutte le sue lezioni ===== */
function myWeekLessons(monday){
  const out = [];
  Object.entries(state.myEnrollments||{}).forEach(([cid,eid])=>{
    const c = state.courses && state.courses[cid];
    if(!c || !eid) return;
    for(let i=0;i<7;i++){
      const date = addDays(monday, i);
      if(date < c.startDate || date > c.endDate) continue;
      const dow = new Date(date+'T00:00:00').getDay();
      const seenHours = new Set();
      getCourseSessions(c).filter(x=>x.weekday===dow && enrolleeAttendsSession(state.myEnrollmentData[cid], x.weekday, x.hour, x.courtId)).forEach(x=>{
        if(seenHours.has(x.hour)) return; seenHours.add(x.hour); // una persona non può essere su due campi alla stessa ora
        out.push({ cid, eid, date, hour:x.hour, courtId:x.courtId, name:c.name });
      });
    }
  });
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.hour-b.hour);
}

      </div>
    </div>

  }
  for(let i=0;i<7;i++){
    const date = addDays(monday, i);
    const dayLessons = lessons.filter(l=>l.date===date);

    const dow = new Date(date+'T00:00:00').getDay();

    dayEl.innerHTML = `<div class="wk-date"><span class="dw">${WEEKDAY_FULL[dow].slice(0,3)}</span><span class="dn">${parts(date).d}</span></div><div class="wk-lessons"></div>`;
    const lessonsEl = dayEl.querySelector('.wk-lessons');

      const row = document.createElement('div');
      row.className = 'wk-lesson' + (absent ? ' absent' : '');
      row.innerHTML = `<div class="wk-time">${pad(l.hour)}</div>
        <div class="wk-meta"><div class="wk-name">${esc(l.name)}</div>${court?`<div class="wk-court">${esc(court)}</div>`:''}</div>

          act.appendChild(badge);
        }
        const btn = document.createElement('button');

        btn.onclick = async () => {
          if(nowDate() >= attendanceCutoff(l.date, l.hour)){ toast('Tempo scaduto: rivolgiti al maestro'); renderApp(); return; }
          if(absent && await substituteBlocksReturn(l.cid, l.date, l.hour, l.courtId)){ await warnSubstituteFound(l.name, l.date, l.hour); return; }
          if(!absent){
            const ok = await askConfirm({
              title: 'Confermi che non ci sarai?',

  }
  card.querySelector('#weekAttPrev').onclick = () => { if(state.weekAttMonday > thisMonday){ state.weekAttMonday = addDays(state.weekAttMonday,-7); renderApp(); } };
  card.querySelector('#weekAttNext').onclick = () => { state.weekAttMonday = addDays(state.weekAttMonday,7); renderApp(); };
  host.replaceChildren(card);
}

const myRecoListeners = new Set();
function loadMyRecoveries(cid, eid){
  if(!eid) return;
  const key = cid+'|'+eid;
  if(myRecoListeners.has(key)) return;
  myRecoListeners.add(key);
  onValue(ref(db, cpath('courseRecoveries/'+cid+'/'+eid)), s=>{
    (state.courseRecoveries[cid] = state.courseRecoveries[cid] || {})[eid] = s.val()||{};
    renderCurrent();
  }, err=>console.error('myRecoveries', err));
}
const recoveryListeners = new Set();
function loadCourseRecoveries(cid){
  if(recoveryListeners.has(cid)) return;
  recoveryListeners.add(cid);
  onValue(ref(db, cpath('courseRecoveries/'+cid)), s=>{
    state.courseRecoveries[cid] = s.val()||{};
    backfillSubstituteMarkers();
    renderCurrent();
  }, err=>console.error('recoveries', err));
}

/* Ore da recuperare = assenze registrate − presenze di recupero confermate dal maestro */
function enrolleeBacklog(fromCid, eid){
  const hist = state.courseAttendanceByCourse[fromCid] || {};
  let absences = 0;
  const fromCourse = state.courses[fromCid];
  const fromE = getEnrollment(fromCid, eid);
  Object.entries(hist).forEach(([date,dm])=>{ if(dm) absences += attAbsentCount(fromCourse, date, dm[eid], fromE); });
  const recs = (state.courseRecoveries[fromCid] || {})[eid] || {};
  const recovered = Object.values(recs).filter(r=>r && r.status==='present').length;
  return { absences, recovered, owed: Math.max(0, absences-recovered) };
}
function lessonRecoveries(toCid, date, hour, courtId){ // hour/courtId omessi = tutta la giornata
  const out = [];
  Object.entries(state.courseRecoveries||{}).forEach(([fromCid, byEid])=>{
    Object.entries(byEid||{}).forEach(([fromEid, recs])=>{
      Object.entries(recs||{}).forEach(([rid, rec])=>{
        if(!(rec && rec.toCid===toCid && rec.toDate===date)) return;
        if(hour!==undefined && rec.toHour!=null && rec.toHour!==hour) return;               // recupero fissato su un'altra ora
        if(courtId && rec.toCourtId && rec.toCourtId!==courtId) return;                     // ...o su un altro campo
        out.push({ fromCid, fromEid, rid, rec });
      });
    });
  });
  return out;
}
function lessonHoles(cid, date, hour, courtId){
  const c = state.courses[cid] || {};
  const day = (state.courseAttendanceByCourse[cid] || {})[date] || {};
  const enrs = state.courseEnrollments[cid];
  const dow = new Date(date+'T00:00:00').getDay();
  const absent = Object.entries(day).filter(([eid,v])=>{
    const e = enrs ? enrs[eid] : undefined;
    if(hour!==undefined && e && !enrolleeAttendsSession(e, dow, hour, courtId)) return false; // non è una sua ora/campo
    return hour===undefined ? attAbsentCount(c,date,v,e)>0 : attGet(v,hour)===false;
  }).length;
  const free = hour===undefined ? Math.max(0, (Number(c.maxSeats)||0) - (Number(c.enrolledCount)||0)) : freeSeatsAt(c, dow, hour, courtId);
  const taken = lessonRecoveries(cid, date, hour, courtId).filter(x=>x.rec.status==='proposed' || x.rec.status==='present').length;
  return { absent, free, taken, holes: Math.max(0, absent + free - taken) };
}
function enrolleePhone(e){
  if(e && e.phone) return e.phone;
  if(e && e.uid){ const m = Object.values(state.members||{}).find(x=>x && x.uid===e.uid); if(m && m.phone) return m.phone; }
  return '';
}
function recoveryCandidates(toCid, date){
  const target = state.courses[toCid] || {};
  const lvl = normTxt(target.livello||'').trim();
  const already = new Set(lessonRecoveries(toCid, date).map(x=>x.fromCid+'|'+x.fromEid));
  const out = [];
  Object.entries(state.courses||{}).forEach(([cid2, c2])=>{
    if(cid2===toCid) return;
    Object.entries(state.courseEnrollments[cid2]||{}).forEach(([eid, e])=>{
      if(already.has(cid2+'|'+eid)) return;
      const bl = enrolleeBacklog(cid2, eid);
      out.push({ fromCid:cid2, fromEid:eid, e, c:c2, owed:bl.owed, sameLevel: normTxt(c2.livello||'').trim()===lvl, name:e.name||'—' });
    });
  });
  return out;
}
/* Segnalino leggibile dai corsisti del corso: "c'è un sostituto" (proposto o confermato) per quella data */
async function syncSubstituteMarker(toCid, date, fromCid, fromEid, status, hour, courtId){
  const mref = ref(db, cpath('courseSubstitutes/'+toCid+'/'+date+'/'+fromCid+'_'+fromEid));
  try{
    if(status==='proposed' || status==='present'){
      const m = { s: status }; if(hour!=null) m.h = hour; if(courtId) m.c = courtId;
      await set(mref, (hour!=null || courtId) ? m : status);
    }
    else await remove(mref);
  }catch(e){ console.warn('courseSubstitutes', e); }
}
const markerSynced = new Set();
function backfillSubstituteMarkers(){ // per i recuperi inseriti prima di questa funzione
  if(!(state.isAdmin || state.isTeacher)) return;
  const today = todayKey();
  Object.entries(state.courseRecoveries||{}).forEach(([fromCid, byEid])=>{
    Object.entries(byEid||{}).forEach(([fromEid, recs])=>{
      Object.values(recs||{}).forEach(rec=>{
        if(!rec || !rec.toCid || !rec.toDate || rec.toDate < today) return;
        if(rec.status!=='proposed' && rec.status!=='present') return;
        if(!(state.isAdmin || isTeacherOfCourse(rec.toCid))) return;
        const k = rec.toCid+'|'+rec.toDate+'|'+fromCid+'|'+fromEid+'|'+rec.status+'|'+(rec.toHour==null?'':rec.toHour)+'|'+(rec.toCourtId||'');
        if(markerSynced.has(k)) return;
        markerSynced.add(k);
        syncSubstituteMarker(rec.toCid, rec.toDate, fromCid, fromEid, rec.status, rec.toHour, rec.toCourtId);
      });
    });
  });
}
async function setRecovery(cd, toCid, date, status, hour, courtId){
  const rec = {
    toCid, toDate:date, status,
    ...(hour!=null ? { toHour: hour } : {}), ...(courtId ? { toCourtId: courtId } : {}),
    name: cd.name||'',
    phone: cd.phone!==undefined ? cd.phone : enrolleePhone(cd.e),
    fromCourse: cd.fromCourseName || (cd.c && cd.c.name) || '',
    level: cd.level || (cd.c && cd.c.livello) || '',
    by: state.uid, ts: Date.now()
  };
  try{
    await set(ref(db, cpath('courseRecoveries/'+cd.fromCid+'/'+cd.fromEid+'/'+date+'_'+toCid)), rec);
    await syncSubstituteMarker(toCid, date, cd.fromCid, cd.fromEid, status, hour, courtId);
  }
  catch(err){ toast('Errore: '+err.message); }
}
async function removeRecovery(p){
  try{
    await remove(ref(db, cpath('courseRecoveries/'+p.fromCid+'/'+p.fromEid+'/'+p.rid)));
    if(p.rec && p.rec.toCid) await syncSubstituteMarker(p.rec.toCid, p.rec.toDate, p.fromCid, p.fromEid, null);
  }
  catch(err){ toast('Errore: '+err.message); }
}
function recoveryMessage(cd, toCourse, date, hour){

    <div class="hint" style="margin-bottom:6px;">Di default: corsisti di altri corsi dello stesso livello (${esc(course.livello||'-')}) con ore da recuperare, prima chi ne ha di più. Puoi cercare anche altri livelli.</div>
    <div class="seg" id="recoLevel" style="margin-bottom:8px;"></div>

    const row = document.createElement('div');
    row.className = 'reco-row' + (isSkipped ? ' skipped' : '');
    row.innerHTML = `<div class="pay-head" style="cursor:default;"><div style="min-width:0;"><div class="pay-name">${esc(cd.name)}${isFirst&&!isSkipped?' <span class="pill" style="padding:2px 7px;">prossimo consigliato</span>':''}</div><div class="hint">${esc(cd.c.name)} · livello ${esc(cd.c.livello||'-')}${cd.sameLevel?'':' · <b>altro livello</b>'}${isSkipped?' · saltato':''}</div></div><span class="pill" style="${cd.owed>0?'color:var(--danger);border-color:var(--danger);':''}">${cd.owed>0?cd.owed+(cd.owed===1?' ora':' ore')+' da recuperare':'nessuna ora da recuperare'}</span></div>`;
    const acts = document.createElement('div'); acts.className = 'reco-actions';
    const wa = document.createElement('button'); wa.className = 'btn-ghost'; wa.style.cssText = 'flex:1;padding:8px 10px;font-size:12px;';
    wa.textContent = phone ? 'Invia messaggio' : 'Nessun numero';
    wa.disabled = !phone;
    wa.onclick = () => {
      window.open('https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent(recoveryMessage(cd, course, date, hour)), '_blank');
      setRecovery(cd, cid, date, 'proposed', hour, courtId);
    };
    const pr = document.createElement('button'); pr.className = 'small-btn'; pr.textContent = 'Presente';
    pr.onclick = () => {
      const msg = cd.owed>0
        ? 'Confermi la presenza di '+cd.name+'? Verrà recuperata in automatico 1 assenza arretrata.'
        : cd.name+' non ha ore da recuperare: registrare comunque la presenza?';
      if(confirm(msg)) setRecovery(cd, cid, date, 'present', hour, courtId);
    };
    const ab = document.createElement('button'); ab.className = 'small-btn'; ab.textContent = 'Assente';
    ab.onclick = () => setRecovery(cd, cid, date, 'absent', hour, courtId);
    const sk = document.createElement('button'); sk.className = 'small-btn'; sk.textContent = isSkipped ? 'Rimetti' : 'Salta';
    sk.onclick = () => { if(skipped[key]) delete skipped[key]; else skipped[key] = true; renderApp(); };
    [wa, pr, ab, sk].forEach(b=>acts.appendChild(b));
    row.appendChild(acts);
    return row;
  }
  let rowsAll = [], rendered = 0;
  function sentinel(){
    const n = rowsAll.length - rendered;
    const s = document.createElement('div'); s.className = 'hint'; s.dataset.sentinel = '1'; s.style.cssText = 'text-align:center;padding:10px 0;';
    s.textContent = n>0 ? 'Scorri per altre opzioni ('+n+')…' : '';
    return s;
  }
  function appendMore(){
    const old = scroll.querySelector('[data-sentinel]'); if(old) old.remove();
    rowsAll.slice(rendered, state.recoLimit).forEach((cd, i)=> scroll.appendChild(makeCandRow(cd, rendered+i===0)));
    rendered = Math.min(rowsAll.length, Math.max(rendered, state.recoLimit));
    if(rendered < rowsAll.length) scroll.appendChild(sentinel());
  }
  if(!loaded){
    scroll.innerHTML = `<div class="hint" style="padding:10px 0;">Carico i corsisti degli altri corsi…</div>`;
  } else {
    rowsAll = computeRows();
    if(!rowsAll.length){
      const q = state.recoSearch.trim();
      scroll.innerHTML = `<div class="hint" style="padding:10px 0;">${q ? 'Nessun corsista trovato.' : 'Nessun corsista con ore da recuperare'+(state.recoAll?'':' in questo livello')+'. Prova "Tutti i livelli" o cerca un nome.'}</div>`;
    } else appendMore();
    scroll.addEventListener('scroll', ()=>{
      state.recoScroll = scroll.scrollTop;
      if(rendered < rowsAll.length && scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 80){
        state.recoLimit += 15;
        appendMore();
      }
    });
  }
  panel.querySelector('#recoSearch').oninput = (e)=>{
    state.recoSearch = e.target.value; state.recoLimit = 15; state.recoScroll = 0;
    if(!loaded) return;
    scroll.innerHTML = ''; rendered = 0; rowsAll = computeRows();
    if(!rowsAll.length) scroll.innerHTML = `<div class="hint" style="padding:10px 0;">${state.recoSearch.trim() ? 'Nessun corsista trovato.' : 'Nessun corsista con ore da recuperare.'}</div>`;
    else appendMore();
  };
  panel._restore = () => { if(state.recoScroll) scroll.scrollTop = state.recoScroll; };
  return panel;
}

  };

  document.getElementById('authSubmit').onclick = async () => {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value;
    const errBox = document.getElementById('authErr');
    errBox.innerHTML = '';
    if(!email || !pass){ errBox.innerHTML = `<div class="error-box">Inserisci email e password.</div>`; return; }
    state.authEmail = email;
    try{
      if(isRegister){
        const name = document.getElementById('authName').value.trim();

        if(!name){ errBox.innerHTML = `<div class="error-box">Inserisci il tuo nome.</div>`; return; }

        await set(ref(db, cpath('members/'+cred.user.uid)), { name, phone: phone||null, uid: cred.user.uid, createdAt: Date.now() });
      } else {
        await signInWithEmailAndPassword(auth, email, pass);

        errBox.innerHTML = `<div class="error-box">Email o password errate. Se non hai ancora un account, tocca "Non hai un account? Registrati" qui sotto.</div>`;

    }
  };

  if(forgotBtn) forgotBtn.onclick = async () => {

    if(!email){ toast('Inserisci prima la tua email'); return; }
    try{ await sendPasswordResetEmail(auth, email); toast('Email di recupero inviata'); }
    catch(e){ toast(translateAuthError(e)); }
  };
}

function translateAuthError(e){
  const code = e && e.code || '';
  const map = {
    'auth/email-already-in-use': 'Questa email è già registrata. Prova ad accedere.',
    'auth/invalid-email': 'Email non valida.',
    'auth/weak-password': 'Password troppo corta (minimo 6 caratteri).',
    'auth/wrong-password': 'Password errata.',
    'auth/invalid-credential': 'Email o password errate.',
    'auth/user-not-found': 'Nessun account con questa email.',
    'auth/too-many-requests': 'Troppi tentativi, riprova tra poco.',
  };
  return map[code] || (e && e.message) || 'Errore sconosciuto.';
}

function isSessionOnDate(course, dateStr){
  if(dateStr < course.startDate || dateStr > course.endDate) return false;
  const dow = new Date(dateStr+'T00:00:00').getDay();
  return getCourseSessions(course).some(s=>s.weekday===dow);
}

function getCourseSessions(course){
  if(Array.isArray(course.sessions) && course.sessions.length) return course.sessions;
  if(course.weekday!==undefined && course.hour!==undefined && course.courtId){
    return [{weekday:course.weekday, hour:course.hour, courtId:course.courtId}];
  }
  return [];
}

function courseCoversSlot(course, courtId, dateStr, hour){
  if(dateStr < course.startDate || dateStr > course.endDate) return false;
  const dow = new Date(dateStr+'T00:00:00').getDay();
  return getCourseSessions(course).some(s => s.courtId===courtId && s.weekday===dow && s.hour===hour);
}

  try{

async function cancelBooking(bid, ownerUid, teacherUid, auditInfo){
  try{
    await remove(ref(db, cpath('bookingsPublic/'+bid)));
    const cleanups = [
      remove(ref(db, cpath('bookingsPrivate/'+bid))),
      remove(ref(db, cpath('myBookings/'+ownerUid+'/'+bid)))
    ];
    if(teacherUid) cleanups.push(remove(ref(db, cpath('myTeachingBookings/'+teacherUid+'/'+bid))));
    await Promise.all(cleanups);
    if(state.isAdmin && auditInfo){
      writeAuditLog({ type:'cancellazione', ...auditInfo });
    }
    toast('Prenotazione annullata');
  }catch(e){ toast('Errore: '+e.message); }
}

/* ================= Raccolta punti: progresso + conferma compagno ================= */
function computeLoyaltyProgress(confirmedMap, redemptionsMap){
  const bands = getLoyaltyBands();
  const confirmed = Object.values(confirmedMap||{});
  const redemptions = redemptionsMap || {};
  return bands.map(band=>{
    const count = confirmed.filter(c=>c.band===band.id).length;
    const earned = Math.floor(count / band.threshold);
    const redeemed = redemptions[band.id] || 0;
    const available = Math.max(0, earned - redeemed);
    const progressInCycle = count % band.threshold;
    const pct = Math.round((progressInCycle / band.threshold) * 100);
    return { band, count, earned, redeemed, available, progressInCycle, pct };
  });
}

  });
  Object.values(state.courses||{}).forEach(c=>{
    if(!c.teacherUid && !c.teacherUid2) return;
    if(dateStr < c.startDate || dateStr > c.endDate) return;
    const dow = new Date(dateStr+'T00:00:00').getDay();

  return busy;
}

function resolveBookingTarget(meObj){

  if(state.bookingForTarget==='__guest__'){

    return { memberId: null, memberName: name, uid: null };
  }
  const m = state.members[state.bookingForTarget];
  if(!m){ toast('Socio non trovato'); return null; }
  return { memberId: state.bookingForTarget, memberName: m.name, uid: m.uid||null };
}

function recurringCoversSlot(r, courtId, dateStr, hour){
  if(r.courtId!==courtId || r.weekday===undefined || r.hour!==hour) return false;
  const dow = new Date(dateStr+'T00:00:00').getDay();
  if(r.weekday!==dow) return false;
  if(dateStr < r.startDate) return false;
  if(r.endDate && dateStr > r.endDate) return false;
  return true;
}

function recurringActiveOnDate(r, dateStr){
  const dow = new Date(dateStr+'T00:00:00').getDay();
  if(r.weekday!==dow) return false;
  if(dateStr < r.startDate) return false;
  if(r.endDate && dateStr > r.endDate) return false;
  return true;
}

function countRecurringOccurrences(r, periodStartDate, periodEndDate){
  const seriesStart = new Date(r.startDate+'T00:00:00');
  let start = new Date(seriesStart > periodStartDate ? seriesStart : periodStartDate);
  start.setHours(0,0,0,0);
  let end = new Date(periodEndDate);
  if(r.endDate){ const e = new Date(r.endDate+'T23:59:59'); if(e<end) end = e; }
  if(start>end) return 0;
  let d = new Date(start);
  let guard = 0;
  while(d.getDay()!==r.weekday){
    d.setDate(d.getDate()+1);
    guard++;
    if(d>end || guard>7) return 0;
  }
  let count = 0;
  while(d<=end){ count++; d.setDate(d.getDate()+7); }
  return count;
}

  const acctCard = document.createElement('div');

  acctHost.appendChild(acctCard);

  const cardsHost = screen.querySelector('#courseCards');

  if(!courseList.length){

    if(nl) loadMyAttendance(cid, nl.date, myEid);
    const myStatus = nl ? attGet(state.myAttendance[cid+'|'+nl.date], nl.hour) : undefined;
    const canDeclare = !!nl && nowDate() < attendanceCutoff(nl.date, nl.hour);
    const row1 = [], row2 = [];
    if(state.isAdmin) row1.push(`<button class="btn-ghost" data-act="enroll" data-cid="${cid}">Iscritti</button>`);

      row1.push(`<button class="btn-ghost" data-act="absences" data-cid="${cid}">Assenze</button>`);
    }
    if(state.isAdmin){
      row2.push(`<button class="btn-ghost" data-act="editcourse" data-cid="${cid}">Modifica</button>`);

    const actionsHtml = [row1,row2].filter(r=>r.length).map(r=>`<div class="course-actions" style="grid-template-columns:repeat(${r.length},minmax(0,1fr));">${r.join('')}</div>`).join('');

      ${fmtDateDisplay(c.startDate)} → ${fmtDateDisplay(c.endDate)} · ${c.teacherUid2 ? 'Maestri' : 'Maestro'}: ${c.teacherName||'—'}${c.teacherUid2 ? ' · '+(c.teacherName2||'—') : ''}<br>

      if(!eid || !nl) return;
      if(nowDate() >= attendanceCutoff(nl.date, nl.hour)){ toast('Tempo scaduto: rivolgiti al maestro'); renderApp(); return; }
      const v = btn.dataset.v === '1';
      if(v && await substituteBlocksReturn(cid, nl.date, nl.hour, nl.courtId)){ await warnSubstituteFound(c.name, nl.date, nl.hour); return; }

        });

        if(nowDate() >= attendanceCutoff(nl.date, nl.hour)){ toast('Tempo scaduto: rivolgiti al maestro'); renderApp(); return; }
      }
      try{
        await writeAttendance(cid, nl.date, eid, nl.hour, v, nl.courtId);

    const enrolledUids = new Set(enrollments.map(([_,e])=>e.uid).filter(Boolean));

    box.querySelector('#enrollPickerHost-'+cid).appendChild(makePicker('enroll-'+cid, memberItems, {

    const enrollListHost = box.querySelector('#enrollList-'+cid);
